[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "master-thesis-tools"
version = "0.1.0"
description = "Utility tooling for the master-thesis repository"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.28.1,<0.29",
    "matplotlib==3.10.9",
    "notebooklm-py[browser]>=0.7.1",
    "numpy==2.2.6",
    "pandas==2.3.3",
    "pillow>=12.2.0,<13",
    "pypdf>=6.10.2,<7",
    "pyyaml==6.0.3",
    "scikit-learn==1.7.2",
    "timm==1.0.22",
    "torch==2.11.0",
]

[project.scripts]
bib = "bib.cli:main"

[dependency-groups]
dev = [
    "click>=8.3.1",
    "pyright>=1.1.408",
    "pysonar>=1.3.0.4086",
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
    "pyyaml>=6.0.3",
    "reportlab>=4.4.4,<5",
    "ruff>=0.14.14",
    "truststore>=0.10.4",
    "vulture>=2.14",
]

[tool.setuptools]
include-package-data = false

[tool.setuptools.package-dir]
"" = ".agents/skills/bib/src"

[tool.setuptools.packages.find]
where = [".agents/skills/bib/src", "experiments/shared"]

[tool.pytest.ini_options]
addopts = "-s"
testpaths = [".agents/skills/bib/tests"]

[tool.vulture]
ignore_names = ["forward"]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
