  weights_sha256: 8d6cea947eb2418c3b0dff48cfb9b238e47744ab0dfca21b2b0637b140769b4b
  batch_size: 64
  dtype: float16
  device: auto

slurm:
  project_root: /home/yannik.qu/master-thesis
  code_dir: /home/yannik.qu/master-thesis/experiments/02_patient_shortage/02_mitigation/23_within_patient_span/code
  output_dir: /home/yannik.qu/master-thesis/experiments/02_patient_shortage/02_mitigation/23_within_patient_span/outputs/bracs/patch
  container: /home/yannik.qu/master-thesis/experiments/environment.sif
  exp2_outputs: /home/yannik.qu/master-thesis/experiments/01_benchmark/02_benchmark_patch/outputs/bracs/patch
  baseline_outputs: /home/yannik.qu/master-thesis/experiments/02_patient_shortage/01_cause/18_bracs_mechanism/outputs/bracs/patch
  whitening_outputs: /home/yannik.qu/master-thesis/experiments/02_patient_shortage/01_cause/18_bracs_mechanism/outputs/bracs/patch
