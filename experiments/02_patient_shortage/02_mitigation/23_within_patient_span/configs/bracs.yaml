# BRACS within-patient span (exp-23: do patch residuals of the same G patients reveal patient directions
# that G patient means cannot? Adds the top within-patient complement directions of the cohort to the RWc
# basis with total added trace s * tr(Sigma_B) (W arms, tuned Wt), or the same eigenvalues on random complement
# directions (R control arms, tuned Rt). Reuses exp-18 cohorts, pool, R/C arms and the RW/RWc arms. CPU-only; no pool stage.

paths:
  outputs: experiments/02_patient_shortage/02_mitigation/23_within_patient_span/outputs/bracs/patch

dataset:
  name: bracs
  regime: patch
  target: roi_subtype
  seed: 0
  version: bracs-official-release
  eligibility_rules:
    metadata: official_BRACS_xlsx_rows_with_patient_slide_roi_and_subtype
    images: roi_filename_stem_matches_released_image
    labels: seven_class_official_roi_subtype
    tiling: non_overlapping_full_256x256_tiles
    split_unit: patient
  root: /home/space/datasets/patho_ds/BRACS
  tile_root: /tmp/bracs_roi_tiles
  tile_squashfs: /home/yannik.qu/master-thesis/experiments/01_benchmark/02_benchmark_patch/outputs/bracs/patch/prepared/roi_tiles.sqfs
  tile_size: 256

feature_extraction:
  model_name: hf-hub:paige-ai/Virchow2
