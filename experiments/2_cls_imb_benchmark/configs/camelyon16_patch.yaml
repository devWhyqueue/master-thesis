# CAMELYON16 patch-classification cell.

paths:
  outputs: experiments/2_cls_imb_benchmark/outputs/camelyon16/patch

dataset:
  name: camelyon16
  regime: patch
  target: tumor_presence
  seed: 0
  version: camelyon16-metadata-v001
  eligibility_rules:
    source: reference_labeled_slides_with_nonempty_20x_patch_directory
    labels: at_least_50_percent_tumor_in_aligned_32x32_mask_cell
    masks: aligned_mask_required
    exclusions: fixed_non_exhaustive_tumor_annotation_list
    split_unit: slide
  root: /home/space/datasets/camelyon16
  patches_root: /home/space/datasets/camelyon16/patches/20x

feature_extraction:
  model_name: hf-hub:paige-ai/Virchow2
  revision: 3158645804b69e3f3bc4439d4116edddf0840a72
  weights_sha256: 8d6cea947eb2418c3b0dff48cfb9b238e47744ab0dfca21b2b0637b140769b4b
  batch_size: 64
  dtype: float16
  device: auto


slurm:
  project_root: /home/yannik.qu/master-thesis
  code_dir: /home/yannik.qu/master-thesis/experiments/2_cls_imb_benchmark/code
  output_dir: /home/yannik.qu/master-thesis/experiments/2_cls_imb_benchmark/outputs/camelyon16/patch
  partition: gpu-2h
  test_partition: gpu-test
  tune_natural_observations_per_candidate: 6
  tune_shards_per_task: 4
  confirm_natural_shards_per_task: 3
  confirm_controlled_shards_per_task: 10
  max_array_concurrency: 20
  container: /home/yannik.qu/master-thesis/experiments/2_cls_imb_benchmark/environment.sif
  resources:
    prepare: {partition: gpu-2h, gpus: 4, cpus: 32, memory: 64G}
    pilot: {partition: gpu-5h, gpus: 1, cpus: 8, memory: 32G}
    freeze: {partition: cpu-2d, gpus: 0, cpus: 4, memory: 256G}
    tune: {partition: gpu-2d, gpus: 1, cpus: 8}
    tune_natural: {partition: gpu-5h, gpus: 1, cpus: 4, memory: 96G, constraint: "80gb|h100|h200"}
    tune_post_hoc_natural: {partition: gpu-5h, gpus: 1, cpus: 2, time: "03:00:00", memory: 96G, constraint: "80gb|h100|h200"}
    tune_controlled: {partition: gpu-5h, gpus: 1, cpus: 4, memory: 96G, constraint: "80gb|40gb|h100|h200"}
    tune_reduce: {partition: cpu-2h, gpus: 0, cpus: 1}
    confirm: {partition: gpu-2d, gpus: 1, cpus: 8}
    confirm_natural: {partition: gpu-5h, gpus: 1, cpus: 8, memory: 96G, constraint: "80gb|h100|h200"}
    confirm_controlled: {partition: gpu-2h, gpus: 1, cpus: 8, memory: 96G, constraint: "80gb|40gb|h100|h200"}
    analyze: {partition: cpu-2d, gpus: 0, cpus: 8, memory: 32G}
    smoke: {partition: gpu-test, gpus: 1, cpus: 4}
  squashfs:
    - source: /home/space/datasets-sqfs/camelyon16-patches-20x.sqfs
      mount: /home/space/datasets/camelyon16/patches/20x
      stages: [prepare]
