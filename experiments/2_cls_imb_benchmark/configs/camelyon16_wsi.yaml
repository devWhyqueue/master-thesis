# CAMELYON16 WSI-level MIL cell.

paths:
  outputs: experiments/2_cls_imb_benchmark/outputs/camelyon16/wsi

dataset:
  name: camelyon16
  regime: wsi
  target: metastasis_presence
  seed: 0
  version: camelyon16-metadata-v001
  eligibility_rules:
    source: reference_labeled_slides_with_nonempty_20x_patch_directory
    labels: official_slide_level_tumor_or_normal_diagnosis
    masks: not_used
    split_unit: slide
  root: /home/space/datasets/camelyon16

feature_extraction:
  model_name: hf-hub:paige-ai/Virchow2
  batch_size: 64
  dtype: float16
  device: auto

evidence:
  patch_per_slide_cap: 500

wsi_training:
  max_instances: 500

slurm:
  project_root: /home/yannik.qu/master-thesis
  code_dir: /home/yannik.qu/master-thesis/experiments/2_cls_imb_benchmark/code
  output_dir: /home/yannik.qu/master-thesis/experiments/2_cls_imb_benchmark/outputs/camelyon16/wsi
  partition: gpu-2h
  test_partition: gpu-test
  container: /home/yannik.qu/master-thesis/experiments/2_cls_imb_benchmark/environment.sif
  resources:
    prepare: {partition: gpu-2h, gpus: 1, cpus: 8, time: "05:00:00"}
    pilot: {partition: cpu-2h, gpus: 0, cpus: 4, time: "02:00:00"}
    freeze: {partition: cpu-2h, gpus: 0, cpus: 4, time: "00:30:00"}
    tune: {partition: gpu-2d, gpus: 1, cpus: 8, time: "2-00:00:00"}
    confirm: {partition: gpu-2d, gpus: 1, cpus: 8, time: "2-00:00:00"}
    analyze: {partition: cpu-2h, gpus: 0, cpus: 4, time: "02:00:00"}
    smoke: {partition: gpu-test, gpus: 1, cpus: 4, time: "00:15:00"}
  squashfs: []
