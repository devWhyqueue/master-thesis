# TCGA-UT WSI-level MIL cell.

paths:
  outputs: experiments/2_cls_imb_benchmark/outputs/tcga_ut/wsi

dataset:
  name: tcga_ut
  regime: wsi
  target: cancer_type
  seed: 0
  version: tcga-ut-komura-2022
  eligibility_rules:
    source: author_supplied_tumor_region_patches_from_diagnostic_slides
    labels: 32_cancer_types_from_source_slide
    evidence: readable_virchow2_cls_patchmean_feature_chunks
    split_unit: tcga_participant
  raw_root: /home/space/datasets/patho_ds/tcga-ut/raw
  feature_dir: /home/space/datasets/patho_ds/tcga-ut/patch_features/cls_patchmean/virchow_virchow2/raw
  feature_glob: "*.pt"
  feature_suffix_pattern: "_[0-9]+"

feature_extraction:
  model_name: hf-hub:paige-ai/Virchow2
  batch_size: 64
  dtype: float16
  device: auto

evidence:
  patch_per_slide_cap: 500

wsi_training:
  max_instances: 500

slurm:
  project_root: /home/yannik.qu/master-thesis
  code_dir: /home/yannik.qu/master-thesis/experiments/2_cls_imb_benchmark/code
  output_dir: /home/yannik.qu/master-thesis/experiments/2_cls_imb_benchmark/outputs/tcga_ut/wsi
  partition: gpu-2h
  test_partition: gpu-test
  container: /home/yannik.qu/master-thesis/experiments/2_cls_imb_benchmark/environment.sif
  resources:
    prepare: {partition: gpu-2h, gpus: 1, cpus: 8, time: "05:00:00"}
    pilot: {partition: cpu-2h, gpus: 0, cpus: 4, time: "02:00:00"}
    freeze: {partition: cpu-2h, gpus: 0, cpus: 4, time: "00:30:00"}
    tune: {partition: gpu-2d, gpus: 1, cpus: 8, time: "2-00:00:00"}
    confirm: {partition: gpu-2d, gpus: 1, cpus: 8, time: "2-00:00:00"}
    analyze: {partition: cpu-2h, gpus: 0, cpus: 4, time: "02:00:00"}
    smoke: {partition: gpu-test, gpus: 1, cpus: 4, time: "00:15:00"}
  squashfs: []
