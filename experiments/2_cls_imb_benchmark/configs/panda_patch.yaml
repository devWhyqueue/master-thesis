# PANDA patch-classification cell.

paths:
  outputs: experiments/2_cls_imb_benchmark/outputs/panda/patch

dataset:
  name: panda
  regime: patch
  target: cancer_presence
  seed: 0
  version: panda-kaggle-2020
  root: /home/space/datasets/panda/raw
  eligibility_rules:
    source: signed_project_owned_panda_patch_materialization
    tiled_evidence: complete_level_0_grid_tissue_audit
    masks: released_provider_specific_mask_required
    labels: at_least_50_percent_provider_specific_cancer_mask_values
    classes: benign_or_cancer
    split_unit: biopsy
  canonical_inventory_path: /home/yannik.qu/master-thesis/experiments/2_cls_imb_benchmark/outputs/panda/patch/materialize/canonical_inventory.csv
  materialization_sidecar: /home/yannik.qu/master-thesis/experiments/2_cls_imb_benchmark/outputs/panda/patch/materialize/materialization.json
  expected_slide_count: 10616

feature_extraction:
  model_name: hf-hub:paige-ai/Virchow2
  revision: 3158645804b69e3f3bc4439d4116edddf0840a72
  weights_sha256: 8d6cea947eb2418c3b0dff48cfb9b238e47744ab0dfca21b2b0637b140769b4b
  batch_size: 64
  dtype: float16
  device: auto

feature_inventory_path: /home/yannik.qu/master-thesis/experiments/2_cls_imb_benchmark/outputs/panda/patch/data/features/panda/feature_inventory.json

patch_training:
  # Validation is ~98% of tune cost (full pass every checkpoint_interval steps).
  # PANDA's controlled budget U=257790 is ~30x CAMELYON16's U=8490, so the
  # interval is scaled to match: 50 * round(257790 / 8490) = 1500, giving
  # PANDA's controlled runs 172 checkpoints against CAMELYON16's 170. The
  # other three datasets keep the CHECKPOINT_INTERVAL default of 50.
  checkpoint_interval: 1500

materialize_panda:
  raw_root: /home/space/datasets/panda/raw
  legacy_tiles_dir: /home/space/datasets/panda/native_tiles_20x_256/patches/20x
  legacy_manifest_dir: /home/space/datasets/panda/native_tiles_20x_256/tiles
  scratch_root: /tmp/panda-materialize
  shard_root: /home/space/datasets-sqfs/panda/patch
  shard_mount_root: /home/space/datasets/panda/patch
  canonical_inventory_path: /home/yannik.qu/master-thesis/experiments/2_cls_imb_benchmark/outputs/panda/patch/materialize/canonical_inventory.csv
  sidecar_path: /home/yannik.qu/master-thesis/experiments/2_cls_imb_benchmark/outputs/panda/patch/materialize/materialization.json
  shard_count: 48
  jpeg_mae_max: 10.0
  audit_shard_count: 32
  audit_workers: null
  audit_io_workers: 2
  audit_band_rows: 512


slurm:
  project_root: /home/yannik.qu/master-thesis
  code_dir: /home/yannik.qu/master-thesis/experiments/2_cls_imb_benchmark/code
  output_dir: /home/yannik.qu/master-thesis/experiments/2_cls_imb_benchmark/outputs/panda/patch
  partition: gpu-2h
  test_partition: gpu-test
  container: /home/yannik.qu/master-thesis/experiments/2_cls_imb_benchmark/environment.sif
  max_array_concurrency: 35
  tune_natural_observations_per_candidate: 6
  # tune_controlled/confirm_controlled moved to gpu-2h (50 slots, higher
  # scheduling priority than gpu-5h's 35). PANDA has a single tail assignment
  # (native only; difficulty_reversed duplicated it and was dropped by
  # freeze), so every condition has exactly 6 observations (1 assignment x 3
  # splits x 2 seeds) and one candidate shard = 6 fits. With
  # patch_training.checkpoint_interval scaled above, one controlled fit is
  # ~8 min measured (job 4698019, CE method, ~8 min startup + 12 fits x ~8 min
  # for shards-per-task=2 = 106 min elapsed on a 120 min wall -- only ~11%
  # margin, and CE is the cheapest method, so slower bundled methods risk
  # timing out). 1 shard/task (~8 min startup + 6 fits x ~8 min = ~56 min)
  # keeps a comfortable margin; the old value of 5 (~22h/task) timed out
  # every task.
  tune_shards_per_task: 1
  tune_natural_shards_per_task: 3
  confirm_natural_shards_per_task: 3
  confirm_controlled_shards_per_task: 7
  resources:
    materialize_audit: {partition: cpu-5h, gpus: 0, cpus: 8, memory: 64G}
    materialize_combine: {partition: cpu-5h, gpus: 0, cpus: 4, memory: 128G}
    materialize_pack: {partition: cpu-5h, gpus: 0, cpus: 8, memory: 64G}
    materialize_publish: {partition: cpu-2h, gpus: 0, cpus: 4, memory: 64G}
    extract: {partition: gpu-2h, gpus: 1, cpus: 8, memory: 64G, constraint: "40gb|80gb|h100|h200"}
    extract_reduce: {partition: cpu-5h, gpus: 0, cpus: 4, memory: 256G}
    prepare: {partition: cpu-5h, gpus: 0, cpus: 8, memory: 256G}
    pilot: {partition: gpu-5h, gpus: 1, cpus: 8, memory: 96G, constraint: "40gb|80gb|h100|h200"}
    freeze: {partition: cpu-5h, gpus: 0, cpus: 4, memory: 96G}
    tune: {partition: gpu-2d, gpus: 1, cpus: 8, memory: 96G, constraint: "40gb|80gb|h100|h200"}
    tune_natural: {partition: gpu-2h, gpus: 1, cpus: 4, memory: 96G, constraint: "40gb|80gb|h100|h200"}
    tune_controlled: {partition: gpu-2h, gpus: 1, cpus: 4, memory: 96G, constraint: "40gb|80gb|h100|h200"}
    tune_reduce: {partition: cpu-2h, gpus: 0, cpus: 4, memory: 256G}
    confirm: {partition: gpu-2d, gpus: 1, cpus: 8}
    confirm_natural: {partition: gpu-2h, gpus: 1, cpus: 8, memory: 96G, constraint: "40gb|80gb|h100|h200"}
    confirm_controlled: {partition: gpu-2h, gpus: 1, cpus: 8, memory: 96G, constraint: "40gb|80gb|h100|h200"}
    analyze: {partition: cpu-5h, gpus: 0, cpus: 8, memory: 256G}
    smoke: {partition: gpu-test, gpus: 1, cpus: 4}
  shared_squashfs:
    - source: /home/space/datasets-sqfs/panda-native-tiles-20x-256.sqfs
      mount: /home/space/datasets/panda/native_tiles_20x_256
      stages: [materialize_audit, materialize_pack]
  writable_paths:
    - path: /home/space/datasets-sqfs/panda/patch
      stages: [materialize_pack, materialize_publish]
  readonly_paths:
    - path: /home/space/datasets/panda/raw
      stages: [materialize_audit, materialize_combine, materialize_pack, materialize_publish]
  sharded_squashfs:
    - source_template: /home/space/datasets-sqfs/panda/patch/shard={index}.sqfs
      mount_template: /home/space/datasets/panda/patch/shard={index}
      stages: [prepare-extract-shard]
