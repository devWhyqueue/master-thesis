# Unified configuration for experiments/2_cls_imb_benchmark/code/imbalance_benchmark.
# Local paths only; scientific controls/grids are checked-in constants in the
# package itself so this file cannot silently change the protocol.

paths:
  outputs: experiments/2_cls_imb_benchmark/outputs

# Select and configure exactly one dataset adapter (imbalance_benchmark.datasets).
# regime: patch | wsi
dataset:
  name: tcga_ut
  regime: patch
  target: cancer_type
  seed: 0

  # Required before a definitive freeze: record the actual dataset release and
  # the exact eligibility pipeline used for this run. Freeze rejects omissions.
  # version:
  # eligibility_rules:

  # tcga_ut
  raw_root: /home/space/datasets/patho_ds/tcga-ut/raw
  feature_dir: /home/space/datasets/patho_ds/tcga-ut/patch_features/cls_patchmean/virchow_virchow2/raw
  feature_glob: "*.pt"
  feature_suffix_pattern: "_[0-9]+"

  # bracs
  # root: /home/space/datasets/patho_ds/bracs
  # metadata_csv:
  # tile_root: /home/space/datasets/patho_ds/bracs/tiles
  # tile_size: 256

  # camelyon16
  # root: /home/space/datasets/patho_ds/camelyon16

  # panda
  # selection_path: /home/space/datasets/patho_ds/panda/selected_slides.csv
  # tiles_dir: /home/space/datasets/patho_ds/panda/tiles

feature_extraction:
  model_name: hf-hub:paige-ai/Virchow2
  batch_size: 64
  dtype: float16
  device: auto

evidence:
  # Fixed before patch-condition construction; this is not the 5% allocation cap.
  patch_per_slide_cap: 500

wsi_training:
  # Fixed before pilot, tuning, confirmation, and RQ3 feature summaries.
  max_instances: 500

slurm:
  # Absolute Hydra paths: jobs execute from the checkout on the cluster, not this PC.
  project_root: /home/yannik.qu/master-thesis
  code_dir: /home/yannik.qu/master-thesis/experiments/2_cls_imb_benchmark/code
  output_dir: /home/yannik.qu/master-thesis/experiments/2_cls_imb_benchmark/outputs
  partition: gpu-2h
  test_partition: gpu-test
  container: /home/yannik.qu/master-thesis/experiments/2_cls_imb_benchmark/environment.sif
  resources:
    prepare: {partition: gpu-2h, gpus: 1, cpus: 8, time: "05:00:00"}
    pilot: {partition: cpu-2h, gpus: 0, cpus: 4, time: "02:00:00"}
    freeze: {partition: cpu-2h, gpus: 0, cpus: 4, time: "00:30:00"}
    tune: {partition: gpu-2d, gpus: 1, cpus: 8, time: "2-00:00:00"}
    confirm: {partition: gpu-2d, gpus: 1, cpus: 8, time: "2-00:00:00"}
    analyze: {partition: cpu-2h, gpus: 0, cpus: 4, time: "02:00:00"}
    smoke: {partition: gpu-test, gpus: 1, cpus: 4, time: "00:15:00"}

  # Optional datasets with many small files. Each image is copied to /tmp per job
  # and mounted at its adapter-visible path before Apptainer starts.
  squashfs: []
