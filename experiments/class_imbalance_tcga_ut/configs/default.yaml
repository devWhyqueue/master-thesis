paths:
  tcga_root: /home/space/datasets/patho_ds/tcga-ut
  raw_root: /home/space/datasets/patho_ds/tcga-ut/raw
  feature_dir: /home/space/datasets/patho_ds/tcga-ut/patch_features/cls_patchmean/virchow_virchow2/raw
  outputs: experiments/class_imbalance_tcga_ut

data:
  feature_glob: "*.pt"
  feature_suffix_pattern: "_[0-9]+"
  min_train_slides_per_class: 1
  validation_fraction: 0.15
  test_fraction: 0.15
  balanced_test_per_class: 0

training:
  seeds: [0, 1, 2]
  batch_size: 128
  bag_batch_size: 8
  epochs: 30
  learning_rate: 0.001
  weight_decay: 0.0001
  hidden_dims: [256]
  dropout: 0.1
  focal_gamma: 2.0
  center_loss_weight: 0.01
  oko_k: 1
  knn_k: 5
  max_instances_per_bag: 16
  max_train_rows:
  max_eval_rows:
  device: auto

synthetic_image_gan:
  enabled: true
  image_size: 64
  latent_dim: 128
  batch_size: 64
  epochs: 25
  learning_rate: 0.0002
  beta1: 0.5
  max_real_patches_per_class: 2048
  generated_patches_per_class: 256
  tail_class_quantile: 0.5
  max_classes:
  encoded_feature_manifest_template: outputs/synthetic_features/seed={seed}/synthetic_feature_manifest.csv
  require_encoded_features: false

methods:
  - ce
  - weighted_ce
  - focal
  - balanced_sampler_ce
  - knn
  - ncc
  - rankmix_mil
  - feature_gan_mil
  - cfal_mil
  - mde_mil
  - sc_mil

slurm:
  partition: gpu-2h
  ntasks_per_node: 8
  container: ./environment.sif
