# BRACS spectrum regularization (exp-22: are the cohort's between-patient eigenvalues too noisy? Keeps
# the cohort eigenbasis of RWc and replaces its eigenvalues by lambda^beta (F/Ba/Bb/Bc, tuned Bt), the
# pool's variance along the cohort directions (O), or top within-patient PCs (P control). Reuses exp-18
# cohorts, pool, and R/C arms and the RW/RWc arms. CPU-only execution on Hydra; no pool stage.

paths:
  outputs: experiments/22_spectrum_regularization/outputs/bracs/patch

dataset:
  name: bracs
  regime: patch
  target: roi_subtype
  seed: 0
  version: bracs-official-release
  eligibility_rules:
    metadata: official_BRACS_xlsx_rows_with_patient_slide_roi_and_subtype
    images: roi_filename_stem_matches_released_image
    labels: seven_class_official_roi_subtype
    tiling: non_overlapping_full_256x256_tiles
    split_unit: patient
  root: /home/space/datasets/patho_ds/BRACS
  tile_root: /tmp/bracs_roi_tiles
  tile_squashfs: /home/yannik.qu/master-thesis/experiments/02_benchmark_patch/outputs/bracs/patch/prepared/roi_tiles.sqfs
  tile_size: 256

feature_extraction:
  model_name: hf-hub:paige-ai/Virchow2
  revision: 3158645804b69e3f3bc4439d4116edddf0840a72
  weights_sha256: 8d6cea947eb2418c3b0dff48cfb9b238e47744ab0dfca21b2b0637b140769b4b
  batch_size: 64
  dtype: float16
  device: auto

slurm:
  project_root: /home/yannik.qu/master-thesis
  code_dir: /home/yannik.qu/master-thesis/experiments/22_spectrum_regularization/code
  output_dir: /home/yannik.qu/master-thesis/experiments/22_spectrum_regularization/outputs/bracs/patch
  container: /home/yannik.qu/master-thesis/experiments/environment.sif
  exp2_outputs: /home/yannik.qu/master-thesis/experiments/02_benchmark_patch/outputs/bracs/patch
  baseline_outputs: /home/yannik.qu/master-thesis/experiments/18_bracs_mechanism/outputs/bracs/patch
  whitening_outputs: /home/yannik.qu/master-thesis/experiments/18_bracs_mechanism/outputs/bracs/patch
  max_array_concurrency: {cpu-5h: 40, cpu-2h: 40}
  resources:
    fit: {partition: cpu-5h, gpus: 0, cpus: 16, memory: 64G}
    analyze: {partition: cpu-5h, gpus: 0, cpus: 8, memory: 64G}
  squashfs: []
