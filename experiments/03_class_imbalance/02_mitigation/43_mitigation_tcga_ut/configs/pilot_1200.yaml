# Step-length pilot for exp-43 (CE only, r1 + r100, shards 0/10/20 = one draw per split -> 6 jobs
# per steps value, 4 values). Run once per steps value in {300, 600, 1200, 2400}: set
# `mitigation.train.stage1.steps`, repoint `paths.outputs`/`slurm.output_dir` at outputs/pilot/steps_<value>,
# submit with --array=0,10,20. Read mean r100 validation BA, wall time, memory, record size, and that
# no stage1.pt remains (the main grid, tcga_ut.yaml, picks steps by the 0.5pp rule).

prevalence:
  patients_per_class: 20

dataset:
  name: tcga_ut
  regime: patch
  target: cancer_type
  seed: 0
  version: tcga-ut-komura-2022
  eligibility_rules:
    source: zenodo_record_5889558_v1_0_authenticated_class_archives
    labels: 30_of_32_cancer_types_from_source_slide
    evidence: materialized_project_owned_squashfs_of_source_jpgs
    split_unit: tcga_participant
    class_exclusions:
      Lymphoid_Neoplasm_Diffuse_Large_B-cell_Lymphoma: dlbcl_contribution_cap_infeasible
      Cholangiocarcinoma: evidence_floor_infeasible_for_split_unit_clustered_inference
  excluded_classes:
    - Lymphoid_Neoplasm_Diffuse_Large_B-cell_Lymphoma
    - Cholangiocarcinoma

paths:
  outputs: experiments/03_class_imbalance/02_mitigation/43_mitigation_tcga_ut/outputs/pilot/steps_1200

mitigation:
  inline_stage2: true
  lora:
    r: 8
    alpha: 16
    dropout: 0.0
  gcl:
    s: 30
    a: 0.9
    b: 0.09
  cuda:
    gamma: 0.6
    check_size: 10
    max_strength: 10
  grid:
    r1:
      stage1:
        ce: [null]
    r100:
      stage1:
        ce: [null]
  train:
    stage1: {batch_size: 256, steps: 1200, lr: 0.0001, weight_decay: 0.0001}
    stage2: {batch_size: 512, steps: 200, lr: 0.001, weight_decay: 0.0}

slurm:
  project_root: /home/yannik.qu/master-thesis
  code_dir: /home/yannik.qu/master-thesis/experiments/03_class_imbalance/02_mitigation/40_methods/code
  output_dir: /home/yannik.qu/master-thesis/experiments/03_class_imbalance/02_mitigation/43_mitigation_tcga_ut/outputs/pilot/steps_1200
  container: /home/yannik.qu/master-thesis/experiments/environment.sif
  exp2_outputs: /home/yannik.qu/master-thesis/experiments/01_benchmark/02_benchmark_patch/outputs/tcga_ut/patch
  shared_squashfs:
    - source: /home/space/datasets-sqfs/tcga-ut/patch.sqfs
      mount: /mnt/tcga-ut
      stages: [fit]
  max_array_concurrency: {gpu-5h: 35, gpu-2h: 50, cpu-5h: 10}
  resources:
    fit: {partition: gpu-5h, gpus: 1, constraint: "80gb|h100|h200|blackwell", cpus: 8, memory: 64G}
    analyze: {partition: cpu-2d, gpus: 0, cpus: 4, memory: 64G}
