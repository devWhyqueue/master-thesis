# BRACS mitigation methods (exp-40). Same patient draws, class permutation, and ratio-arm
# allocation as exp-26 (G=10, DEPTH=160, BALANCED=32); training reads raw patch images instead of
# cached Virchow2 features, since every method here adapts the encoder itself via LoRA.

prevalence:
  patients_per_class: 10

dataset:
  name: bracs
  regime: patch
  target: roi_subtype
  seed: 0
  version: bracs-official-release
  eligibility_rules:
    metadata: official_BRACS_xlsx_rows_with_patient_slide_roi_and_subtype
    images: roi_filename_stem_matches_released_image
    labels: seven_class_official_roi_subtype
    tiling: non_overlapping_full_256x256_tiles
    split_unit: patient

paths:
  outputs: experiments/03_class_imbalance/02_mitigation/40_methods/outputs/bracs/patch

mitigation:
  lora:
    r: 8
    alpha: 16
    dropout: 0.0
  gcl:
    s: 30
    a: 0.9
    b: 0.09
  grid:
    arms: [r1, r100]
    stage1:
      ce: [null]
      bs: [0.5, 1.0]
      mixup: [0.2]
      la: [1.0]
      gcl: [0.1]
    stage2:
      posthoc_la: [1.0]
      crt: [null]
      disalign: [1.0]
      gcl2: [null]
  train:
    stage1: {batch_size: 256, steps: 2000, lr: 0.0001, weight_decay: 0.0001}
    stage2: {batch_size: 512, steps: 200, lr: 0.001, weight_decay: 0.0}

slurm:
  project_root: /home/yannik.qu/master-thesis
  code_dir: /home/yannik.qu/master-thesis/experiments/03_class_imbalance/02_mitigation/40_methods/code
  output_dir: /home/yannik.qu/master-thesis/experiments/03_class_imbalance/02_mitigation/40_methods/outputs/bracs/patch
  container: /home/yannik.qu/master-thesis/experiments/environment.sif
  exp2_outputs: /home/yannik.qu/master-thesis/experiments/01_benchmark/02_benchmark_patch/outputs/bracs/patch
  squashfs:
    - source: /home/space/datasets-sqfs/bracs-roi-tiles.sqfs
      mount: /tmp/bracs_roi_tiles
      stages: [fit]
  resources:
    fit: {partition: gpu-5h, gpus: 1, constraint: "80gb|h100|h200", cpus: 8, memory: 64G}
    stage2: {partition: cpu-2h, gpus: 0, cpus: 4, memory: 32G}
