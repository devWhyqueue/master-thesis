# TCGA-UT mitigation methods (exp-40). Same patient draws, class permutation, and ratio-arm
# allocation as exp-25 (G=20, DEPTH=160, BALANCED=32); training reads raw patch images instead of
# cached Virchow2 features, since every method here adapts the encoder itself via LoRA.

prevalence:
  patients_per_class: 20

dataset:
  name: tcga_ut
  regime: patch
  target: cancer_type
  seed: 0
  version: tcga-ut-komura-2022
  eligibility_rules:
    source: zenodo_record_5889558_v1_0_authenticated_class_archives
    labels: 30_of_32_cancer_types_from_source_slide
    evidence: materialized_project_owned_squashfs_of_source_jpgs
    split_unit: tcga_participant
    class_exclusions:
      Lymphoid_Neoplasm_Diffuse_Large_B-cell_Lymphoma: dlbcl_contribution_cap_infeasible
      Cholangiocarcinoma: evidence_floor_infeasible_for_split_unit_clustered_inference
  excluded_classes:
    - Lymphoid_Neoplasm_Diffuse_Large_B-cell_Lymphoma
    - Cholangiocarcinoma

paths:
  outputs: experiments/03_class_imbalance/02_mitigation/40_methods/outputs/tcga_ut/patch

mitigation:
  lora:
    r: 8
    alpha: 16
    dropout: 0.0
  gcl:
    s: 30
    a: 0.9
    b: 0.09
  grid:
    r1: &methods_grid
      stage1:
        ce: [null]
        bs: [0.5, 1.0]
        mixup: [0.2]
        la: [1.0]
        gcl: [0.1]
      stage2:
        posthoc_la: [1.0]
        crt: [null]
        disalign: [1.0]
        gcl2: [0.1]
    r100: *methods_grid
  train:
    stage1: {batch_size: 256, steps: 2000, lr: 0.0001, weight_decay: 0.0001}
    stage2: {batch_size: 512, steps: 200, lr: 0.001, weight_decay: 0.0}

slurm:
  project_root: /home/yannik.qu/master-thesis
  code_dir: /home/yannik.qu/master-thesis/experiments/03_class_imbalance/02_mitigation/40_methods/code
  output_dir: /home/yannik.qu/master-thesis/experiments/03_class_imbalance/02_mitigation/40_methods/outputs/tcga_ut/patch
  container: /home/yannik.qu/master-thesis/experiments/environment.sif
  exp2_outputs: /home/yannik.qu/master-thesis/experiments/01_benchmark/02_benchmark_patch/outputs/tcga_ut/patch
  shared_squashfs:
    - source: /home/space/datasets-sqfs/tcga-ut/patch.sqfs
      mount: /mnt/tcga-ut
      stages: [fit]
  resources:
    fit: {partition: gpu-5h, gpus: 1, constraint: "80gb|h100|h200", cpus: 8, memory: 64G}
    stage2: {partition: cpu-2h, gpus: 0, cpus: 4, memory: 32G}
    analyze: {partition: cpu-5h, gpus: 0, cpus: 4, memory: 32G}
