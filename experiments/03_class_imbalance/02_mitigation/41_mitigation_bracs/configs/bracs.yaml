# Mitigation recovery on BRACS (exp-41): reuses exp-40's code (`slurm.code_dir` below) and exp-26's
# design (G=10, DEPTH=160, BALANCED=32, same patient draws/class permutation via prevalence.fit).
# Arms: r1 CE (damage anchor, undamaged) + every exp-40 method at r50, r100, and N (native class
# shares, realized rho ~6.7 per exp-26). See report/41_mitigation_bracs.tex "Design" for the original
# param choices; r50/N mirror r100's grid.
#
# 2026-09-28: widened mixup/gcl/gcl2/disalign after the first pass's selected_param_frequency
# hugged one grid edge in every arm (mixup->0.2, gcl/gcl2->0.05, disalign->1.5, all boundaries of
# their tested range) -- added a value past that edge (mixup 0.05, gcl/gcl2 0.02, disalign 2.0) to
# check whether the true optimum sits outside the original grid. la stayed at {0.5,1.0}: tau=1
# is the theoretical full-correction target (report Sec. "Logit Adjustment"), not an arbitrary
# bound, so its edge-hugging isn't a grid-scoping problem. bs stayed at {0.5,1.0}: s in [0,1] is
# the method's own defined range and its picks split near-evenly in 2 of 3 arms. gcl2's values
# must match gcl's (its stage-two source), so both were widened together.
#
# 2026-09-28 (2nd pass): after the first widening, r50/r100 landed interior values for gcl/gcl2/
# disalign, but arm N alone flipped to hugging the *new* top edge (gcl2->0.2, disalign->2.0) --
# extended N only (gcl/gcl2 0.5, disalign 3.0) to check whether N's optimum keeps climbing or
# settles. mixup still hugs its low edge in every arm; not widened further (mechanism finding:
# uniform partner sampling never touches the class prior, so no amount of alpha fixes it).
#
# 2026-09-28 (3rd pass): MixUp replaced by CUDA (curriculum of data augmentation) per the exp-40
# methods report's revised "Data-Level Methods" section -- p_aug in {0.25, 0.5, 1.0} in every arm,
# gamma/check_size/max_strength fixed via mitigation.cuda below. Old mixup* run dirs stay on disk;
# analyze ignores them (they don't match any grid combo any more).

prevalence:
  patients_per_class: 10

dataset:
  name: bracs
  regime: patch
  target: roi_subtype
  seed: 0
  version: bracs-official-release
  eligibility_rules:
    metadata: official_BRACS_xlsx_rows_with_patient_slide_roi_and_subtype
    images: roi_filename_stem_matches_released_image
    labels: seven_class_official_roi_subtype
    tiling: non_overlapping_full_256x256_tiles
    split_unit: patient

paths:
  outputs: experiments/03_class_imbalance/02_mitigation/41_mitigation_bracs/outputs/bracs/patch

mitigation:
  lora:
    r: 8
    alpha: 16
    dropout: 0.0
  gcl:
    s: 30
    a: 0.9
    b: 0.09
  cuda:
    gamma: 0.6
    check_size: 10
    max_strength: 10
  grid:
    r1:
      stage1:
        ce: [null]
    r50:
      stage1:
        ce: [null]
        bs: [0.5, 1.0]
        cuda: [0.25, 0.5, 1.0]
        la: [0.5, 1.0]
        gcl: [0.02, 0.05, 0.2]
      stage2:
        posthoc_la: [0.5, 1.0, 1.5, 2.0]
        disalign: [0.5, 1.0, 1.5, 2.0]
        crt: [null]
        gcl2: [0.02, 0.05, 0.2]
    r100:
      stage1:
        ce: [null]
        bs: [0.5, 1.0]
        cuda: [0.25, 0.5, 1.0]
        la: [0.5, 1.0]
        gcl: [0.02, 0.05, 0.2]
      stage2:
        posthoc_la: [0.5, 1.0, 1.5, 2.0]
        disalign: [0.5, 1.0, 1.5, 2.0]
        crt: [null]
        gcl2: [0.02, 0.05, 0.2]
    N:
      stage1:
        ce: [null]
        bs: [0.5, 1.0]
        cuda: [0.25, 0.5, 1.0]
        la: [0.5, 1.0]
        gcl: [0.02, 0.05, 0.2, 0.5]
      stage2:
        posthoc_la: [0.5, 1.0, 1.5, 2.0]
        disalign: [0.5, 1.0, 1.5, 2.0, 3.0]
        crt: [null]
        gcl2: [0.02, 0.05, 0.2, 0.5]
  train:
    # steps=600 from the pilot (report "Design", pilot subsection): the only candidate within
    # 0.5pp of the best mean r100 validation BA over {150, 300, 600, 1200} (0.3493 vs 0.3187,
    # 0.3422, 0.3342); observed wall time ~30-33 min/fit, well inside gpu-2h.
    stage1: {batch_size: 256, steps: 600, lr: 0.0001, weight_decay: 0.0001}
    stage2: {batch_size: 512, steps: 200, lr: 0.001, weight_decay: 0.0}

slurm:
  project_root: /home/yannik.qu/master-thesis
  code_dir: /home/yannik.qu/master-thesis/experiments/03_class_imbalance/02_mitigation/40_methods/code
  output_dir: /home/yannik.qu/master-thesis/experiments/03_class_imbalance/02_mitigation/41_mitigation_bracs/outputs/bracs/patch
  container: /home/yannik.qu/master-thesis/experiments/environment.sif
  exp2_outputs: /home/yannik.qu/master-thesis/experiments/01_benchmark/02_benchmark_patch/outputs/bracs/patch
  squashfs:
    - source: /home/space/datasets-sqfs/bracs-roi-tiles.sqfs
      mount: /tmp/bracs_roi_tiles
      stages: [fit]
  max_array_concurrency: {gpu-5h: 35, gpu-2h: 50, cpu-2h: 50}
  resources:
    # gpu-2h, not gpu-5h: pilot wall time at steps=600 was ~30-33 min/fit.
    fit: {partition: gpu-2h, gpus: 1, constraint: "80gb|h100|h200", cpus: 8, memory: 64G}
    stage2: {partition: cpu-2h, gpus: 0, cpus: 4, memory: 32G}
    analyze: {partition: cpu-5h, gpus: 0, cpus: 4, memory: 32G}
