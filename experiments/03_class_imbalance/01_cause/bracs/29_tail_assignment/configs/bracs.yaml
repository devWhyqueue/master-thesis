# BRACS tail-class assignment experiment (exp-29). exp-26's ratio arms r{rho} permute the
# class-to-rank assignment once per (split, draw); this experiment cycles that same draw's
# permutation through its other 6 cyclic shifts (Latin square over class x rank), so every one
# of BRACS's 7 classes sits in the tail exactly once per draw. Shift k = 0 (r1/r10/r100) is
# reused unchanged from exp-26's stored outputs. G = 10 (BRACS deviates from exp-25/27's
# G = 20: at DEPTH = 160 only 10-13 ADH train patients per split qualify). CPU-only.

prevalence:
  patients_per_class: 10

paths:
  outputs: experiments/03_class_imbalance/01_cause/bracs/29_tail_assignment/outputs/bracs/patch

dataset:
  name: bracs
  regime: patch
  target: roi_subtype
  seed: 0
  version: bracs-official-release
  eligibility_rules:
    metadata: official_BRACS_xlsx_rows_with_patient_slide_roi_and_subtype
    images: roi_filename_stem_matches_released_image
    labels: seven_class_official_roi_subtype
    tiling: non_overlapping_full_256x256_tiles
    split_unit: patient
  root: /home/space/datasets/patho_ds/BRACS
  tile_root: /tmp/bracs_roi_tiles
  tile_squashfs: /home/yannik.qu/master-thesis/experiments/01_benchmark/02_benchmark_patch/outputs/bracs/patch/prepared/roi_tiles.sqfs
  tile_size: 256

feature_extraction:
  model_name: hf-hub:paige-ai/Virchow2
  revision: 3158645804b69e3f3bc4439d4116edddf0840a72
  weights_sha256: 8d6cea947eb2418c3b0dff48cfb9b238e47744ab0dfca21b2b0637b140769b4b
  batch_size: 64
  dtype: float16
  device: auto

slurm:
  project_root: /home/yannik.qu/master-thesis
  code_dir: /home/yannik.qu/master-thesis/experiments/03_class_imbalance/01_cause/bracs/29_tail_assignment/code
  output_dir: /home/yannik.qu/master-thesis/experiments/03_class_imbalance/01_cause/bracs/29_tail_assignment/outputs/bracs/patch
  container: /home/yannik.qu/master-thesis/experiments/environment.sif
  exp2_outputs: /home/yannik.qu/master-thesis/experiments/01_benchmark/02_benchmark_patch/outputs/bracs/patch
  prevalence_outputs: /home/yannik.qu/master-thesis/experiments/03_class_imbalance/00_damage/26_damage_bracs/outputs/bracs/patch
  max_array_concurrency: {cpu-5h: 40, cpu-2h: 40}
  resources:
    fit: {partition: cpu-5h, gpus: 0, cpus: 16, memory: 64G}
    analyze: {partition: cpu-5h, gpus: 0, cpus: 8, memory: 64G}
  squashfs: []
