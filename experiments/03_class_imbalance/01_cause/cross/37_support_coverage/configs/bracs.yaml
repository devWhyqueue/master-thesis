# BRACS support-coverage experiment (exp-37; code shared with configs/tcga_ut.yaml).
# Does coverage-maximizing S-arm selection recover damage from thin support, at exp-36's own native
# G = 10, 320 balanced patches/class regime, rho = 100? Three S arms (random/coverage/redundant)
# reselect S100's own per-class, per-patient counts from a frozen 320-row B pool, fit tuned then
# re-evaluated at B's own fixed lambda. CPU-only, zero-fit precheck (gates 0-2).

paths:
  outputs: experiments/03_class_imbalance/01_cause/cross/37_support_coverage/outputs/bracs/patch

dataset:
  name: bracs
  regime: patch
  target: roi_subtype
  seed: 0
  version: bracs-official-release
  eligibility_rules:
    metadata: official_BRACS_xlsx_rows_with_patient_slide_roi_and_subtype
    images: roi_filename_stem_matches_released_image
    labels: seven_class_official_roi_subtype
    tiling: non_overlapping_full_256x256_tiles
    split_unit: patient
  root: /home/space/datasets/patho_ds/BRACS
  tile_root: /tmp/bracs_roi_tiles
  tile_squashfs: /home/yannik.qu/master-thesis/experiments/01_benchmark/02_benchmark_patch/outputs/bracs/patch/prepared/roi_tiles.sqfs
  tile_size: 256

feature_extraction:
  model_name: hf-hub:paige-ai/Virchow2
  revision: 3158645804b69e3f3bc4439d4116edddf0840a72
  weights_sha256: 8d6cea947eb2418c3b0dff48cfb9b238e47744ab0dfca21b2b0637b140769b4b
  batch_size: 64
  dtype: float16
  device: auto

slurm:
  project_root: /home/yannik.qu/master-thesis
  code_dir: /home/yannik.qu/master-thesis/experiments/03_class_imbalance/01_cause/cross/37_support_coverage/code
  output_dir: /home/yannik.qu/master-thesis/experiments/03_class_imbalance/01_cause/cross/37_support_coverage/outputs/bracs/patch
  container: /home/yannik.qu/master-thesis/experiments/environment.sif
  exp2_outputs: /home/yannik.qu/master-thesis/experiments/01_benchmark/02_benchmark_patch/outputs/bracs/patch
  peer_outputs: /home/yannik.qu/master-thesis/experiments/03_class_imbalance/01_cause/cross/37_support_coverage/outputs/tcga_ut/patch
  fixed_lambda_prior_check: /home/yannik.qu/master-thesis/experiments/03_class_imbalance/01_cause/cross/36_joint_mechanism/report/fixed_lambda_prior_check.json
  max_array_concurrency: {cpu-5h: 40}
  resources:
    precheck: {partition: cpu-5h, gpus: 0, cpus: 16, memory: 64G}
    fit: {partition: cpu-5h, gpus: 0, cpus: 16, memory: 64G}
    analyze: {partition: cpu-5h, gpus: 0, cpus: 8, memory: 64G}
