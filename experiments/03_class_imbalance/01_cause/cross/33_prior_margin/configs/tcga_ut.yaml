# TCGA-UT prior-injection margin experiment (exp-33; code shared with configs/bracs.yaml). 0 new
# fits: for every stored r1 fit (exp-25's balanced training, slurm.prevalence_outputs), injects
# the same draw's r{rho} class counts (exp-27's own P{rho}/r{rho} arms, slurm.p_outputs, set the
# pre-registered gate) post hoc, Q{rho} = argmax(log p_r1 + log(n_c / sum n)). H1's cross-dataset
# gap and H3's BRACS overlay read the BRACS run's own output through slurm.peer_outputs once it
# has completed; H3 (7-class K-control subset screen) only runs here (30 classes > SUBSET_K).
# CPU-only, analysis only.

paths:
  outputs: experiments/03_class_imbalance/01_cause/cross/33_prior_margin/outputs/tcga_ut/patch

dataset:
