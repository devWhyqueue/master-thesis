# BRACS prior-injection margin experiment (exp-33; code shared with configs/tcga_ut.yaml). 0 new
# fits: for every stored r1 fit (exp-26's balanced training, slurm.prevalence_outputs), injects
# the same draw's r{rho} class counts (exp-28's own P{rho}/r{rho} arms, slurm.p_outputs, set the
# pre-registered gate) post hoc, Q{rho} = argmax(log p_r1 + log(n_c / sum n)). H1's cross-dataset
# gap reads the TCGA-UT run's own output through slurm.peer_outputs once it has completed; BRACS
# has no H3 (its 7 classes equal SUBSET_K, so no subset screen runs). CPU-only, analysis only.

paths:
  outputs: experiments/03_class_imbalance/01_cause/cross/33_prior_margin/outputs/bracs/patch

dataset:
  name: bracs
  regime: patch
  target: roi_subtype
  seed: 0
  version: bracs-official-release
  eligibility_rules:
    metadata: official_BRACS_xlsx_rows_with_patient_slide_roi_and_subtype
    images: roi_filename_stem_matches_released_image
    labels: seven_class_official_roi_subtype
    tiling: non_overlapping_full_256x256_tiles
    split_unit: patient
  root: /home/space/datasets/patho_ds/BRACS
  tile_root: /tmp/bracs_roi_tiles
  tile_squashfs: /home/yannik.qu/master-thesis/experiments/01_benchmark/02_benchmark_patch/outputs/bracs/patch/prepared/roi_tiles.sqfs
  tile_size: 256

feature_extraction:
  model_name: hf-hub:paige-ai/Virchow2
  revision: 3158645804b69e3f3bc4439d4116edddf0840a72
  weights_sha256: 8d6cea947eb2418c3b0dff48cfb9b238e47744ab0dfca21b2b0637b140769b4b
  batch_size: 64
  dtype: float16
  device: auto

slurm:
  project_root: /home/yannik.qu/master-thesis
  code_dir: /home/yannik.qu/master-thesis/experiments/03_class_imbalance/01_cause/cross/33_prior_margin/code
  output_dir: /home/yannik.qu/master-thesis/experiments/03_class_imbalance/01_cause/cross/33_prior_margin/outputs/bracs/patch
  container: /home/yannik.qu/master-thesis/experiments/environment.sif
  exp2_outputs: /home/yannik.qu/master-thesis/experiments/01_benchmark/02_benchmark_patch/outputs/bracs/patch
  prevalence_outputs: /home/yannik.qu/master-thesis/experiments/03_class_imbalance/00_damage/26_damage_bracs/outputs/bracs/patch
  p_outputs: /home/yannik.qu/master-thesis/experiments/03_class_imbalance/01_cause/bracs/28_prior_vs_support/outputs/bracs/patch
  peer_outputs: /home/yannik.qu/master-thesis/experiments/03_class_imbalance/01_cause/cross/33_prior_margin/outputs/tcga_ut/patch
  max_array_concurrency: {cpu-2h: 40}
  resources:
    inject: {partition: cpu-2h, gpus: 0, cpus: 4, memory: 32G}
    analyze: {partition: cpu-2h, gpus: 0, cpus: 8, memory: 32G}
  squashfs: []
