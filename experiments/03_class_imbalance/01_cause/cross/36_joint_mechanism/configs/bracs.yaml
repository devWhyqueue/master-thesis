# BRACS joint-mechanism experiment (exp-36; code shared with configs/tcga_ut.yaml).
# Four settings (native, separation_only, centre_only, joint) cross exp-34's frozen alpha_expand
# with a new dense same-cohort centre correction, fitting B/P/S/R (rho = 100) at G = 10, 320
# balanced patches/class. Wrong-direction (joint S/R) and fixed-lambda (native P/S/R, joint B/P/S/R)
# controls are computed within the same (split, draw) shard. CPU-only.

paths:
  outputs: experiments/03_class_imbalance/01_cause/cross/36_joint_mechanism/outputs/bracs/patch

dataset:
  name: bracs
  regime: patch
  target: roi_subtype
  seed: 0
  version: bracs-official-release
  eligibility_rules:
    metadata: official_BRACS_xlsx_rows_with_patient_slide_roi_and_subtype
    images: roi_filename_stem_matches_released_image
    labels: seven_class_official_roi_subtype
    tiling: non_overlapping_full_256x256_tiles
    split_unit: patient
  root: /home/space/datasets/patho_ds/BRACS
  tile_root: /tmp/bracs_roi_tiles
  tile_squashfs: /home/yannik.qu/master-thesis/experiments/01_benchmark/02_benchmark_patch/outputs/bracs/patch/prepared/roi_tiles.sqfs
  tile_size: 256

feature_extraction:
  model_name: hf-hub:paige-ai/Virchow2
  revision: 3158645804b69e3f3bc4439d4116edddf0840a72
  weights_sha256: 8d6cea947eb2418c3b0dff48cfb9b238e47744ab0dfca21b2b0637b140769b4b
  batch_size: 64
  dtype: float16
  device: auto

slurm:
  project_root: /home/yannik.qu/master-thesis
  code_dir: /home/yannik.qu/master-thesis/experiments/03_class_imbalance/01_cause/cross/36_joint_mechanism/code
  output_dir: /home/yannik.qu/master-thesis/experiments/03_class_imbalance/01_cause/cross/36_joint_mechanism/outputs/bracs/patch
  container: /home/yannik.qu/master-thesis/experiments/environment.sif
  exp2_outputs: /home/yannik.qu/master-thesis/experiments/01_benchmark/02_benchmark_patch/outputs/bracs/patch
  separation_outputs: /home/yannik.qu/master-thesis/experiments/03_class_imbalance/01_cause/cross/34_separation_intervention/outputs/bracs/patch
  native_prevalence_outputs: /home/yannik.qu/master-thesis/experiments/03_class_imbalance/00_damage/26_damage_bracs/outputs/bracs/patch
  peer_outputs: /home/yannik.qu/master-thesis/experiments/03_class_imbalance/01_cause/cross/36_joint_mechanism/outputs/tcga_ut/patch
  max_array_concurrency: {cpu-5h: 40, cpu-2h: 40}
  resources:
    precheck: {partition: cpu-2h, gpus: 0, cpus: 8, memory: 64G}
    fit_pilot: {partition: cpu-5h, gpus: 0, cpus: 16, memory: 64G}
    analyze_pilot: {partition: cpu-2h, gpus: 0, cpus: 8, memory: 32G}
    fit_main: {partition: cpu-5h, gpus: 0, cpus: 16, memory: 64G}
    analyze_main: {partition: cpu-5h, gpus: 0, cpus: 8, memory: 64G}
    report: {partition: cpu-2h, gpus: 0, cpus: 4, memory: 16G}
  squashfs: []
