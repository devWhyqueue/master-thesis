# TCGA-UT class-properties cross-dataset experiment (exp-35; code shared with configs/bracs.yaml).
# 0 new fits: pools stored per-class recall from exp-25 (r10/r100), exp-30 (easy/hard_r100), and
# exp-32 (worst/flip/mild_r100) as the total-arm pool, plus exp-27's P10/P100 as the prior-only
# pool, regresses Delta_fc on allocation + cross-fitted headroom/margin + a BRACS indicator, and
# checks how far the indicator shrinks (see cross/35_class_properties/code). The gate reads only
# both datasets' stored r1 fits, via slurm.gate_peer. CPU-only, analysis only.

paths:
  outputs: experiments/03_class_imbalance/01_cause/cross/35_class_properties/outputs/tcga_ut/patch

dataset:
  name: tcga_ut
  regime: patch
  target: cancer_type
  seed: 0
  version: tcga-ut-komura-2022
  eligibility_rules:
    source: zenodo_record_5889558_v1_0_authenticated_class_archives
    labels: 30_of_32_cancer_types_from_source_slide
    evidence: materialized_project_owned_squashfs_of_source_jpgs
    split_unit: tcga_participant
    class_exclusions:
      Lymphoid_Neoplasm_Diffuse_Large_B-cell_Lymphoma: dlbcl_contribution_cap_infeasible
      Cholangiocarcinoma: evidence_floor_infeasible_for_split_unit_clustered_inference
  excluded_classes:
    - Lymphoid_Neoplasm_Diffuse_Large_B-cell_Lymphoma
    - Cholangiocarcinoma
  root: /mnt/tcga-ut
  materialization_sidecar: /home/space/datasets-sqfs/tcga-ut/patch.provenance.json
  expected_slide_count: 8736
  expected_class_count: 32
  expected_patch_count: 1608060

feature_extraction:
  model_name: hf-hub:paige-ai/Virchow2
  revision: 3158645804b69e3f3bc4439d4116edddf0840a72
  weights_sha256: 8d6cea947eb2418c3b0dff48cfb9b238e47744ab0dfca21b2b0637b140769b4b
  batch_size: 64
  dtype: float16
  device: auto

slurm:
  project_root: /home/yannik.qu/master-thesis
  code_dir: /home/yannik.qu/master-thesis/experiments/03_class_imbalance/01_cause/cross/35_class_properties/code
  output_dir: /home/yannik.qu/master-thesis/experiments/03_class_imbalance/01_cause/cross/35_class_properties/outputs/tcga_ut/patch
  container: /home/yannik.qu/master-thesis/experiments/environment.sif
  exp2_outputs: /home/yannik.qu/master-thesis/experiments/01_benchmark/02_benchmark_patch/outputs/tcga_ut/patch
  prevalence_outputs: /home/yannik.qu/master-thesis/experiments/03_class_imbalance/00_damage/25_damage_tcga_ut/outputs/tcga_ut/patch
  p_outputs: /home/yannik.qu/master-thesis/experiments/03_class_imbalance/01_cause/tcga_ut/27_prior_vs_support/outputs/tcga_ut/patch
  tail_outputs: /home/yannik.qu/master-thesis/experiments/03_class_imbalance/01_cause/tcga_ut/30_tail_assignment/outputs/tcga_ut/patch
  rate_outputs: /home/yannik.qu/master-thesis/experiments/03_class_imbalance/01_cause/tcga_ut/32_worst_assignment_rate/outputs/tcga_ut/patch
  peer_outputs: /home/yannik.qu/master-thesis/experiments/03_class_imbalance/01_cause/cross/35_class_properties/outputs/bracs/patch
  gate_peer:
    name: bracs
    prevalence_outputs: /home/yannik.qu/master-thesis/experiments/03_class_imbalance/00_damage/26_damage_bracs/outputs/bracs/patch
    exp2_outputs: /home/yannik.qu/master-thesis/experiments/01_benchmark/02_benchmark_patch/outputs/bracs/patch
  max_array_concurrency: {cpu-2h: 40}
  resources:
    gate: {partition: cpu-2h, gpus: 0, cpus: 4, memory: 32G}
    extract: {partition: cpu-2h, gpus: 0, cpus: 8, memory: 32G}
    analyze: {partition: cpu-2h, gpus: 0, cpus: 8, memory: 32G}
  squashfs: []
