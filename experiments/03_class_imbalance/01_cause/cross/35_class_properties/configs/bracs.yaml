# BRACS class-properties cross-dataset experiment (exp-35; code shared with configs/tcga_ut.yaml).
# 0 new fits: pools stored per-class recall from exp-26 (r10/r100) and exp-29's Latin-square
# shifts (a1..a6_r{rho}) as the total-arm pool, plus exp-28's P10/P100 as the prior-only pool.
# G = 10 (BRACS deviates from TCGA-UT's G = 20: at DEPTH = 160 only 10-13 ADH train patients per
# split qualify). CPU-only, analysis only.

prevalence:
  patients_per_class: 10

paths:
  outputs: experiments/03_class_imbalance/01_cause/cross/35_class_properties/outputs/bracs/patch

dataset:
  name: bracs
  regime: patch
  target: roi_subtype
  seed: 0
  version: bracs-official-release
  eligibility_rules:
    metadata: official_BRACS_xlsx_rows_with_patient_slide_roi_and_subtype
    images: roi_filename_stem_matches_released_image
    labels: seven_class_official_roi_subtype
    tiling: non_overlapping_full_256x256_tiles
    split_unit: patient
  root: /home/space/datasets/patho_ds/BRACS
  tile_root: /tmp/bracs_roi_tiles
  tile_squashfs: /home/yannik.qu/master-thesis/experiments/01_benchmark/02_benchmark_patch/outputs/bracs/patch/prepared/roi_tiles.sqfs
  tile_size: 256

feature_extraction:
  model_name: hf-hub:paige-ai/Virchow2
  revision: 3158645804b69e3f3bc4439d4116edddf0840a72
  weights_sha256: 8d6cea947eb2418c3b0dff48cfb9b238e47744ab0dfca21b2b0637b140769b4b
  batch_size: 64
  dtype: float16
  device: auto

slurm:
  project_root: /home/yannik.qu/master-thesis
  code_dir: /home/yannik.qu/master-thesis/experiments/03_class_imbalance/01_cause/cross/35_class_properties/code
  output_dir: /home/yannik.qu/master-thesis/experiments/03_class_imbalance/01_cause/cross/35_class_properties/outputs/bracs/patch
  container: /home/yannik.qu/master-thesis/experiments/environment.sif
  exp2_outputs: /home/yannik.qu/master-thesis/experiments/01_benchmark/02_benchmark_patch/outputs/bracs/patch
  prevalence_outputs: /home/yannik.qu/master-thesis/experiments/03_class_imbalance/00_damage/26_damage_bracs/outputs/bracs/patch
  p_outputs: /home/yannik.qu/master-thesis/experiments/03_class_imbalance/01_cause/bracs/28_prior_vs_support/outputs/bracs/patch
  assignment_outputs: /home/yannik.qu/master-thesis/experiments/03_class_imbalance/01_cause/bracs/29_tail_assignment/outputs/bracs/patch
  peer_outputs: /home/yannik.qu/master-thesis/experiments/03_class_imbalance/01_cause/cross/35_class_properties/outputs/tcga_ut/patch
  gate_peer:
    name: tcga_ut
    prevalence_outputs: /home/yannik.qu/master-thesis/experiments/03_class_imbalance/00_damage/25_damage_tcga_ut/outputs/tcga_ut/patch
    exp2_outputs: /home/yannik.qu/master-thesis/experiments/01_benchmark/02_benchmark_patch/outputs/tcga_ut/patch
  max_array_concurrency: {cpu-2h: 40}
  resources:
    gate: {partition: cpu-2h, gpus: 0, cpus: 4, memory: 32G}
    extract: {partition: cpu-2h, gpus: 0, cpus: 8, memory: 32G}
    analyze: {partition: cpu-2h, gpus: 0, cpus: 8, memory: 32G}
  squashfs: []
