# BRACS class-separation intervention experiment (exp-34; code shared with configs/tcga_ut.yaml).
# Fits B/P/S/R (exp-27/28's balanced/prior/support/imbalanced reweighting, rho = 100) on
# ``expanded_bracs`` (features shifted by x^(alpha) toward TCGA-UT's separation, alpha frozen at
# precheck) plus a pilot-only ``native_bracs_replay`` (gate 1, reproduction against exp-28's own
# stored r1/P100/S100/r100). Native BRACS/TCGA-UT G=20 controls are reused, not refit
# (slurm.native_prevalence_outputs / slurm.native_cause_outputs). CPU-only.

paths:
  outputs: experiments/03_class_imbalance/01_cause/cross/34_separation_intervention/outputs/bracs/patch

dataset:
  name: bracs
  regime: patch
  target: roi_subtype
  seed: 0
  version: bracs-official-release
  eligibility_rules:
    metadata: official_BRACS_xlsx_rows_with_patient_slide_roi_and_subtype
    images: roi_filename_stem_matches_released_image
    labels: seven_class_official_roi_subtype
    tiling: non_overlapping_full_256x256_tiles
    split_unit: patient
  root: /home/space/datasets/patho_ds/BRACS
  tile_root: /tmp/bracs_roi_tiles
  tile_squashfs: /home/yannik.qu/master-thesis/experiments/01_benchmark/02_benchmark_patch/outputs/bracs/patch/prepared/roi_tiles.sqfs
  tile_size: 256

feature_extraction:
  model_name: hf-hub:paige-ai/Virchow2
  revision: 3158645804b69e3f3bc4439d4116edddf0840a72
  weights_sha256: 8d6cea947eb2418c3b0dff48cfb9b238e47744ab0dfca21b2b0637b140769b4b
  batch_size: 64
  dtype: float16
  device: auto

slurm:
  project_root: /home/yannik.qu/master-thesis
  code_dir: /home/yannik.qu/master-thesis/experiments/03_class_imbalance/01_cause/cross/34_separation_intervention/code
  output_dir: /home/yannik.qu/master-thesis/experiments/03_class_imbalance/01_cause/cross/34_separation_intervention/outputs/bracs/patch
  container: /home/yannik.qu/master-thesis/experiments/environment.sif
  exp2_outputs: /home/yannik.qu/master-thesis/experiments/01_benchmark/02_benchmark_patch/outputs/bracs/patch
  native_prevalence_outputs: /home/yannik.qu/master-thesis/experiments/03_class_imbalance/00_damage/26_damage_bracs/outputs/bracs/patch
  native_cause_outputs: /home/yannik.qu/master-thesis/experiments/03_class_imbalance/01_cause/bracs/28_prior_vs_support/outputs/bracs/patch
  peer_outputs: /home/yannik.qu/master-thesis/experiments/03_class_imbalance/01_cause/cross/34_separation_intervention/outputs/tcga_ut/patch
  max_array_concurrency: {cpu-5h: 40, cpu-2h: 40}
  resources:
    precheck: {partition: cpu-2h, gpus: 0, cpus: 8, memory: 64G}
    fit_pilot: {partition: cpu-2h, gpus: 0, cpus: 8, memory: 32G}
    analyze_pilot: {partition: cpu-2h, gpus: 0, cpus: 8, memory: 32G}
    fit_main: {partition: cpu-5h, gpus: 0, cpus: 16, memory: 64G}
    analyze_main: {partition: cpu-5h, gpus: 0, cpus: 8, memory: 64G}
    report: {partition: cpu-2h, gpus: 0, cpus: 4, memory: 16G}
  squashfs: []
