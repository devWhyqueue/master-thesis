# BRACS dataset-gap descriptive analysis (exp-47; code shared with the other dataset's config).
# 0 new fits: reads the stored balanced r1 and r100 fits (slurm.prevalence_outputs) and the
# prior-only P100 / support-only S100 fits (slurm.p_outputs) for 3 splits x 10 draws, plus frozen
# Virchow2 features through the exp-2 manifests (slurm.exp2_outputs). CPU-only.

paths:
  outputs: experiments/03_class_imbalance/01_cause/cross/47_dataset_gap/outputs/bracs/patch

dataset:
  name: bracs
  regime: patch
  target: roi_subtype
  seed: 0
  version: bracs-official-release
  eligibility_rules:
    metadata: official_BRACS_xlsx_rows_with_patient_slide_roi_and_subtype
    images: roi_filename_stem_matches_released_image
    labels: seven_class_official_roi_subtype
    tiling: non_overlapping_full_256x256_tiles
    split_unit: patient
  root: /home/space/datasets/patho_ds/BRACS
  tile_root: /tmp/bracs_roi_tiles
  tile_squashfs: /home/yannik.qu/master-thesis/experiments/01_benchmark/02_benchmark_patch/outputs/bracs/patch/prepared/roi_tiles.sqfs
  tile_size: 256

feature_extraction:
  model_name: hf-hub:paige-ai/Virchow2
  revision: 3158645804b69e3f3bc4439d4116edddf0840a72
  weights_sha256: 8d6cea947eb2418c3b0dff48cfb9b238e47744ab0dfca21b2b0637b140769b4b
  batch_size: 64
  dtype: float16
  device: auto

analysis:
  seed: 20261107
  n_patients: 10
  n_patches: 32
  k_values: [5, 15, 30]
  primary_k: 15
  pairs: [[ADH, DCIS]]

slurm:
  project_root: /home/yannik.qu/master-thesis
  code_dir: /home/yannik.qu/master-thesis/experiments/03_class_imbalance/01_cause/cross/47_dataset_gap/code
  output_dir: /home/yannik.qu/master-thesis/experiments/03_class_imbalance/01_cause/cross/47_dataset_gap/outputs/bracs/patch
  container: /home/yannik.qu/master-thesis/experiments/environment.sif
  exp2_outputs: /home/yannik.qu/master-thesis/experiments/01_benchmark/02_benchmark_patch/outputs/bracs/patch
  prevalence_outputs: /home/yannik.qu/master-thesis/experiments/03_class_imbalance/00_damage/26_damage_bracs/outputs/bracs/patch
  p_outputs: /home/yannik.qu/master-thesis/experiments/03_class_imbalance/01_cause/bracs/28_prior_vs_support/outputs/bracs/patch
  max_array_concurrency: {cpu-2h: 3}
  resources:
    geometry: {partition: cpu-2h, gpus: 0, cpus: 8, memory: 48G}
    analyze: {partition: cpu-2h, gpus: 0, cpus: 8, memory: 64G}
    smoke: {partition: cpu-test, gpus: 0, cpus: 4, memory: 32G}
    images: {partition: cpu-2h, gpus: 0, cpus: 2, memory: 8G}
  squashfs: []
  # Example tiles are read at the manifest's own image root (images stage only).
  shared_squashfs:
    - {source: /home/yannik.qu/master-thesis/experiments/01_benchmark/02_benchmark_patch/outputs/bracs/patch/prepared/roi_tiles.sqfs, mount: /tmp/bracs_roi_tiles, stages: [images]}
