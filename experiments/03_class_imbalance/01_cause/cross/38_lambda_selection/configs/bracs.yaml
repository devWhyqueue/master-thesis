# BRACS lambda-selection experiment (exp-38; code shared with configs/tcga_ut.yaml).
# How much of exp-36's native prior-channel gap (D_P(BRACS) - D_P(TCGA-UT)) closes under better
# lambda selection? Every rule re-predicts exp-36's own stored grids (pilot draws 0-1 for phase 1,
# this experiment's own draws 2-9 fits for phase 2) -- no refit for phase 1, native B/P/S/R refit
# for phase 2 only, since exp-36's own main-phase grid.npz files are not retained. CPU-only.

paths:
  outputs: experiments/03_class_imbalance/01_cause/cross/38_lambda_selection/outputs/bracs/patch

dataset:
  name: bracs
  regime: patch
  target: roi_subtype
  seed: 0
  version: bracs-official-release
  eligibility_rules:
    metadata: official_BRACS_xlsx_rows_with_patient_slide_roi_and_subtype
    images: roi_filename_stem_matches_released_image
    labels: seven_class_official_roi_subtype
    tiling: non_overlapping_full_256x256_tiles
    split_unit: patient
  root: /home/space/datasets/patho_ds/BRACS
  tile_root: /tmp/bracs_roi_tiles
  tile_squashfs: /home/yannik.qu/master-thesis/experiments/01_benchmark/02_benchmark_patch/outputs/bracs/patch/prepared/roi_tiles.sqfs
  tile_size: 256

feature_extraction:
  model_name: hf-hub:paige-ai/Virchow2
  revision: 3158645804b69e3f3bc4439d4116edddf0840a72
  weights_sha256: 8d6cea947eb2418c3b0dff48cfb9b238e47744ab0dfca21b2b0637b140769b4b
  batch_size: 64
  dtype: float16
  device: auto

slurm:
  project_root: /home/yannik.qu/master-thesis
  code_dir: /home/yannik.qu/master-thesis/experiments/03_class_imbalance/01_cause/cross/38_lambda_selection/code
  output_dir: /home/yannik.qu/master-thesis/experiments/03_class_imbalance/01_cause/cross/38_lambda_selection/outputs/bracs/patch
  container: /home/yannik.qu/master-thesis/experiments/environment.sif
  exp2_outputs: /home/yannik.qu/master-thesis/experiments/01_benchmark/02_benchmark_patch/outputs/bracs/patch
  joint36_outputs: /home/yannik.qu/master-thesis/experiments/03_class_imbalance/01_cause/cross/36_joint_mechanism/outputs/bracs/patch
  peer_outputs: /home/yannik.qu/master-thesis/experiments/03_class_imbalance/01_cause/cross/38_lambda_selection/outputs/tcga_ut/patch
  fixed_lambda_prior_check: /home/yannik.qu/master-thesis/experiments/03_class_imbalance/01_cause/cross/36_joint_mechanism/report/fixed_lambda_prior_check.json
  max_array_concurrency: {cpu-5h: 40, cpu-2h: 40}
  resources:
    precheck: {partition: cpu-2h, gpus: 0, cpus: 8, memory: 32G}
    fit: {partition: cpu-5h, gpus: 0, cpus: 16, memory: 64G}
    oracle: {partition: cpu-2h, gpus: 0, cpus: 8, memory: 32G}
    analyze: {partition: cpu-5h, gpus: 0, cpus: 8, memory: 64G}
  squashfs: []
