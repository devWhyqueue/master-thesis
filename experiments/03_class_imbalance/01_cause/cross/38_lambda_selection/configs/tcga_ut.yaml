# TCGA-UT lambda-selection experiment (exp-38; code shared with configs/bracs.yaml).
# How much of exp-36's native prior-channel gap (D_P(BRACS) - D_P(TCGA-UT)) closes under better
# lambda selection? Every rule re-predicts exp-36's own stored grids (pilot draws 0-1 for phase 1,
# this experiment's own draws 2-9 fits for phase 2) -- no refit for phase 1, native B/P/S/R refit
# for phase 2 only, since exp-36's own main-phase grid.npz files are not retained. CPU-only.

paths:
  outputs: experiments/03_class_imbalance/01_cause/cross/38_lambda_selection/outputs/tcga_ut/patch

dataset:
  name: tcga_ut
  regime: patch
  target: cancer_type
  seed: 0
  version: tcga-ut-komura-2022
  eligibility_rules:
    source: zenodo_record_5889558_v1_0_authenticated_class_archives
    labels: 30_of_32_cancer_types_from_source_slide
    evidence: materialized_project_owned_squashfs_of_source_jpgs
    split_unit: tcga_participant
    class_exclusions:
      Lymphoid_Neoplasm_Diffuse_Large_B-cell_Lymphoma: dlbcl_contribution_cap_infeasible
      Cholangiocarcinoma: evidence_floor_infeasible_for_split_unit_clustered_inference
  excluded_classes:
    - Lymphoid_Neoplasm_Diffuse_Large_B-cell_Lymphoma
    - Cholangiocarcinoma
  root: /mnt/tcga-ut
  materialization_sidecar: /home/space/datasets-sqfs/tcga-ut/patch.provenance.json
  expected_slide_count: 8736
  expected_class_count: 32
  expected_patch_count: 1608060

feature_extraction:
  model_name: hf-hub:paige-ai/Virchow2
  revision: 3158645804b69e3f3bc4439d4116edddf0840a72
  weights_sha256: 8d6cea947eb2418c3b0dff48cfb9b238e47744ab0dfca21b2b0637b140769b4b
  batch_size: 64
  dtype: float16
  device: auto

slurm:
  project_root: /home/yannik.qu/master-thesis
  code_dir: /home/yannik.qu/master-thesis/experiments/03_class_imbalance/01_cause/cross/38_lambda_selection/code
  output_dir: /home/yannik.qu/master-thesis/experiments/03_class_imbalance/01_cause/cross/38_lambda_selection/outputs/tcga_ut/patch
  container: /home/yannik.qu/master-thesis/experiments/environment.sif
  exp2_outputs: /home/yannik.qu/master-thesis/experiments/01_benchmark/02_benchmark_patch/outputs/tcga_ut/patch
  joint36_outputs: /home/yannik.qu/master-thesis/experiments/03_class_imbalance/01_cause/cross/36_joint_mechanism/outputs/tcga_ut/patch
  peer_outputs: /home/yannik.qu/master-thesis/experiments/03_class_imbalance/01_cause/cross/38_lambda_selection/outputs/bracs/patch
  fixed_lambda_prior_check: /home/yannik.qu/master-thesis/experiments/03_class_imbalance/01_cause/cross/36_joint_mechanism/report/fixed_lambda_prior_check.json
  max_array_concurrency: {cpu-5h: 40, cpu-2h: 40}
  resources:
    precheck: {partition: cpu-2h, gpus: 0, cpus: 8, memory: 32G}
    fit: {partition: cpu-5h, gpus: 0, cpus: 16, memory: 64G}
    oracle: {partition: cpu-2h, gpus: 0, cpus: 8, memory: 32G}
    analyze: {partition: cpu-5h, gpus: 0, cpus: 8, memory: 64G}
  squashfs: []
