# TCGA-UT worst tail-class assignment experiment, rate-weighted score (exp-32). Part A (0 new
# fits) sanity-checks a rate-weighted directed pair-separation score S against exp-30's already-
# observed easy/hard/random damage and fits a D-on-S calibration line. Part B (90 new fits) fits
# the worst (argmax S_rate), flip (reversed worst, direction control), and mild (argmin S_rate)
# orders at rho 100. Same G = 20 patients/class, class permutation, and patient draws as
# exp-25/27/30/31. CPU-only.

