# Part B (120 new fits) fits the worst (sep, argmax S), direction-control (flip, reversed sep),
# and mildest (tog, argmin S) orders at rho 100, plus sep again at rho 10. Same G = 20
# patients/class, class permutation, and patient draws as exp-25/27/30. CPU-only.

