# BRACS prevalence imbalance (exp-25). At a fixed total patch budget T = G x BALANCED x num_classes
# (G = 20 patients/class, BALANCED = 32 patches/patient), ratio arms r1..r100 redistribute T across a
# permuted class rank with exp-02's exponential-profile allocator; N keeps native class shares.
# Every arm is fit fresh (no reuse). CPU-only.

# BRACS deviates from G = 20: at DEPTH = 160 only 10-13 ADH train patients per split qualify, so
# G = 10 (T = 10 x 32 x 7); the full ratio grid up to r = 100 stays feasible (head 1206 <= 1600).
prevalence:
  patients_per_class: 10

paths:
  outputs: experiments/6_deprivation/25_prevalence_imbalance/outputs/bracs/patch

dataset:
  name: bracs
  regime: patch
  target: roi_subtype
  seed: 0
  version: bracs-official-release
  eligibility_rules:
    metadata: official_BRACS_xlsx_rows_with_patient_slide_roi_and_subtype
    images: roi_filename_stem_matches_released_image
    labels: seven_class_official_roi_subtype
    tiling: non_overlapping_full_256x256_tiles
    split_unit: patient
  root: /home/space/datasets/patho_ds/BRACS
  tile_root: /tmp/bracs_roi_tiles
  tile_squashfs: /home/yannik.qu/master-thesis/experiments/2_benchmark/02_benchmark_patch/outputs/bracs/patch/prepared/roi_tiles.sqfs
  tile_size: 256

feature_extraction:
  model_name: hf-hub:paige-ai/Virchow2
  revision: 3158645804b69e3f3bc4439d4116edddf0840a72
  weights_sha256: 8d6cea947eb2418c3b0dff48cfb9b238e47744ab0dfca21b2b0637b140769b4b
  batch_size: 64
  dtype: float16
  device: auto

slurm:
  project_root: /home/yannik.qu/master-thesis
  code_dir: /home/yannik.qu/master-thesis/experiments/6_deprivation/25_prevalence_imbalance/code
  output_dir: /home/yannik.qu/master-thesis/experiments/6_deprivation/25_prevalence_imbalance/outputs/bracs/patch
  container: /home/yannik.qu/master-thesis/experiments/environment.sif
  exp2_outputs: /home/yannik.qu/master-thesis/experiments/2_benchmark/02_benchmark_patch/outputs/bracs/patch
  max_array_concurrency: {cpu-5h: 40, cpu-2h: 40}
  resources:
    fit: {partition: cpu-5h, gpus: 0, cpus: 16, memory: 64G}
    analyze: {partition: cpu-5h, gpus: 0, cpus: 8, memory: 64G}
  squashfs: []
