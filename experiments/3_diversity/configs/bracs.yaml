# BRACS diversity-at-fixed-support cell (exp-3).
#
# dataset/feature_extraction/squashfs blocks are copied verbatim from
# experiments/2_benchmark_patch/configs/bracs_patch.yaml (exp-3 never
# extracts features itself, only reads exp-2's frozen ones, but keeps these
# blocks for dataset-regime detection and any future squashfs staging need).
# The slurm block is exp-3's own (plan "Cluster wiring"): stage names
# remapped to build|check|fit|analyze, plus the new slurm.exp2_outputs key
# pointing at exp-2's frozen source manifests and run records.

paths:
  outputs: experiments/3_diversity/outputs/bracs/patch

dataset:
  name: bracs
  regime: patch
  target: roi_subtype
  seed: 0
  version: bracs-official-release
  eligibility_rules:
    metadata: official_BRACS_xlsx_rows_with_patient_slide_roi_and_subtype
    images: roi_filename_stem_matches_released_image
    labels: seven_class_official_roi_subtype
    tiling: non_overlapping_full_256x256_tiles
    split_unit: patient
  root: /home/space/datasets/patho_ds/BRACS
  tile_root: /tmp/bracs_roi_tiles
  tile_squashfs: /home/yannik.qu/master-thesis/experiments/2_benchmark_patch/outputs/bracs/patch/prepared/roi_tiles.sqfs
  tile_size: 256

feature_extraction:
  model_name: hf-hub:paige-ai/Virchow2
  revision: 3158645804b69e3f3bc4439d4116edddf0840a72
  weights_sha256: 8d6cea947eb2418c3b0dff48cfb9b238e47744ab0dfca21b2b0637b140769b4b
  batch_size: 64
  dtype: float16
  device: auto

slurm:
  project_root: /home/yannik.qu/master-thesis
  code_dir: /home/yannik.qu/master-thesis/experiments/3_diversity/code
  output_dir: /home/yannik.qu/master-thesis/experiments/3_diversity/outputs/bracs/patch
  container: /home/yannik.qu/master-thesis/experiments/2_benchmark_patch/environment.sif
  exp2_outputs: /home/yannik.qu/master-thesis/experiments/2_benchmark_patch/outputs/bracs/patch
  max_array_concurrency: {gpu-5h: 35, gpu-2h: 50}
  resources:
    build: {partition: cpu-5h, gpus: 0, cpus: 8, memory: 256G}
    check: {partition: cpu-5h, gpus: 0, cpus: 8, memory: 256G}
    import-anchor: {partition: cpu-5h, gpus: 0, cpus: 4}
    fit: {partition: gpu-5h, gpus: 1, cpus: 8, memory: 64G, constraint: "80gb|40gb|h100|h200"}
    analyze: {partition: cpu-2d, gpus: 0, cpus: 16, memory: 128G}
  squashfs: []
