# TCGA-UT diversity-at-fixed-support cell (exp-3).
#
# dataset/feature_extraction blocks are copied verbatim from
# experiments/2_benchmark_patch/configs/tcga_ut_patch.yaml (needed so
# manifest_freeze.json's deep-copied runtime_config keeps resolving TCGA-UT's
# feature-provenance lock the same way exp-2 already does). The raw-image
# squashfs mount is scoped to exp-2's own 'prepare' stage there and is not
# reproduced here: exp-3 only ever reads already-extracted Virchow2 feature
# files, never the source images, on any of its build|check|fit|analyze
# stages. The slurm block is exp-3's own (plan "Cluster wiring").

paths:
  outputs: experiments/3_diversity/outputs/tcga_ut/patch

dataset:
  name: tcga_ut
  regime: patch
  target: cancer_type
  seed: 0
  version: tcga-ut-komura-2022
  eligibility_rules:
    source: zenodo_record_5889558_v1_0_authenticated_class_archives
    labels: 30_of_32_cancer_types_from_source_slide
    evidence: materialized_project_owned_squashfs_of_source_jpgs
    split_unit: tcga_participant
    class_exclusions:
      Lymphoid_Neoplasm_Diffuse_Large_B-cell_Lymphoma: dlbcl_contribution_cap_infeasible
      Cholangiocarcinoma: evidence_floor_infeasible_for_split_unit_clustered_inference
  excluded_classes:
    - Lymphoid_Neoplasm_Diffuse_Large_B-cell_Lymphoma
    - Cholangiocarcinoma
  root: /mnt/tcga-ut
  materialization_sidecar: /home/space/datasets-sqfs/tcga-ut/patch.provenance.json
  expected_slide_count: 8736
  expected_class_count: 32
  expected_patch_count: 1608060

feature_extraction:
  model_name: hf-hub:paige-ai/Virchow2
  revision: 3158645804b69e3f3bc4439d4116edddf0840a72
  weights_sha256: 8d6cea947eb2418c3b0dff48cfb9b238e47744ab0dfca21b2b0637b140769b4b
  batch_size: 64
  dtype: float16
  device: auto

slurm:
  project_root: /home/yannik.qu/master-thesis
  code_dir: /home/yannik.qu/master-thesis/experiments/3_diversity/code
  output_dir: /home/yannik.qu/master-thesis/experiments/3_diversity/outputs/tcga_ut/patch
  container: /home/yannik.qu/master-thesis/experiments/2_benchmark_patch/environment.sif
  exp2_outputs: /home/yannik.qu/master-thesis/experiments/2_benchmark_patch/outputs/tcga_ut/patch
  max_array_concurrency: {gpu-5h: 35, gpu-2h: 50}
  resources:
    build: {partition: cpu-5h, gpus: 0, cpus: 8, memory: 256G}
    check: {partition: cpu-2h, gpus: 0, cpus: 8, memory: 256G}
    import-anchor: {partition: cpu-5h, gpus: 0, cpus: 4}
    fit: {partition: gpu-5h, gpus: 1, cpus: 8, memory: 64G, constraint: "80gb|40gb|h100|h200"}
    analyze: {partition: cpu-2d, gpus: 0, cpus: 16, memory: 128G}
  squashfs: []
