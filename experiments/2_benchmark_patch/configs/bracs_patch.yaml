# BRACS ROI patch-classification cell.

paths:
  outputs: experiments/2_benchmark_patch/outputs/bracs/patch

dataset:
  name: bracs
  regime: patch
  target: roi_subtype
  seed: 0
  version: bracs-official-release
  eligibility_rules:
    metadata: official_BRACS_xlsx_rows_with_patient_slide_roi_and_subtype
    images: roi_filename_stem_matches_released_image
    labels: seven_class_official_roi_subtype
    tiling: non_overlapping_full_256x256_tiles
    split_unit: patient
  root: /home/space/datasets/patho_ds/BRACS
  tile_root: /tmp/bracs_roi_tiles
  tile_squashfs: /home/yannik.qu/master-thesis/experiments/2_benchmark_patch/outputs/bracs/patch/prepared/roi_tiles.sqfs
  tile_size: 256

feature_extraction:
  model_name: hf-hub:paige-ai/Virchow2
  revision: 3158645804b69e3f3bc4439d4116edddf0840a72
  weights_sha256: 8d6cea947eb2418c3b0dff48cfb9b238e47744ab0dfca21b2b0637b140769b4b
  batch_size: 64
  dtype: float16
  device: auto


slurm:
  project_root: /home/yannik.qu/master-thesis
  code_dir: /home/yannik.qu/master-thesis/experiments/2_benchmark_patch/code
  output_dir: /home/yannik.qu/master-thesis/experiments/2_benchmark_patch/outputs/bracs/patch
  partition: gpu-2h
  test_partition: gpu-test
  tune_natural_observations_per_candidate: 6
  tune_shards_per_task: 4
  confirm_natural_shards_per_task: 3
  confirm_controlled_shards_per_task: 10
  max_array_concurrency: 20
  container: /home/yannik.qu/master-thesis/experiments/2_benchmark_patch/environment.sif
  resources:
    prepare: {partition: gpu-5h, gpus: 1, cpus: 8}
    pilot: {partition: cpu-2h, gpus: 0, cpus: 4}
    freeze: {partition: cpu-2d, gpus: 0, cpus: 4}
    signals: {partition: cpu-5h, gpus: 0, cpus: 4, memory: 32G}
    tune: {partition: gpu-2d, gpus: 1, cpus: 8}
    tune_natural: {partition: gpu-2h, gpus: 1, cpus: 4, memory: 32G}
    tune_controlled: {partition: gpu-5h, gpus: 1, cpus: 4, memory: 32G}
    tune_reduce: {partition: cpu-2h, gpus: 0, cpus: 1}
    confirm: {partition: gpu-2d, gpus: 1, cpus: 8}
    confirm_natural: {partition: gpu-2h, gpus: 1, cpus: 8, memory: 32G}
    confirm_controlled: {partition: gpu-2h, gpus: 1, cpus: 8, memory: 32G}
    analyze: {partition: cpu-5h, gpus: 0, cpus: 8, memory: 32G}
    smoke: {partition: gpu-test, gpus: 1, cpus: 4}
  squashfs: []

# Pooled standardization for the prespecified matching rule (protocol
# app:testing): the dominant shortage is a z-score across every unit of every
# dataset, so `match` must see all four roots even when it writes into one of
# them. Without this block cmd_match falls back to this config's own root and
# would standardize a single dataset against itself.
rq3:
  dataset_roots:
    - /home/yannik.qu/master-thesis/experiments/2_benchmark_patch/outputs/bracs/patch
    - /home/yannik.qu/master-thesis/experiments/2_benchmark_patch/outputs/camelyon16/patch
    - /home/yannik.qu/master-thesis/experiments/2_benchmark_patch/outputs/panda/patch
    - /home/yannik.qu/master-thesis/experiments/2_benchmark_patch/outputs/tcga_ut/patch
