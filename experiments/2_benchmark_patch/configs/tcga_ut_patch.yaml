# TCGA-UT patch-classification cell.

paths:
  outputs: experiments/2_benchmark_patch/outputs/tcga_ut/patch

dataset:
  name: tcga_ut
  regime: patch
  target: cancer_type
  seed: 0
  version: tcga-ut-komura-2022
  eligibility_rules:
    source: zenodo_record_5889558_v1_0_authenticated_class_archives
    labels: 30_of_32_cancer_types_from_source_slide
    evidence: materialized_project_owned_squashfs_of_source_jpgs
    split_unit: tcga_participant
    class_exclusions:
      Lymphoid_Neoplasm_Diffuse_Large_B-cell_Lymphoma: dlbcl_contribution_cap_infeasible
      Cholangiocarcinoma: evidence_floor_infeasible_for_split_unit_clustered_inference
  excluded_classes:
    - Lymphoid_Neoplasm_Diffuse_Large_B-cell_Lymphoma
    - Cholangiocarcinoma
  root: /mnt/tcga-ut
  materialization_sidecar: /home/space/datasets-sqfs/tcga-ut/patch.provenance.json
  expected_slide_count: 8736
  expected_class_count: 32
  expected_patch_count: 1608060

feature_extraction:
  model_name: hf-hub:paige-ai/Virchow2
  revision: 3158645804b69e3f3bc4439d4116edddf0840a72
  weights_sha256: 8d6cea947eb2418c3b0dff48cfb9b238e47744ab0dfca21b2b0637b140769b4b
  batch_size: 64
  dtype: float16
  device: auto

# Standalone materialization step (run once via `materialize-tcga-ut`, not part
# of the submitted workflow): authenticates the shared archive against Zenodo
# and publishes the project-owned SqFS that `dataset.root` mounts above.
materialize_tcga_ut:
  record_id: "5889558"
  zenodo_version: "1.0"
  shared_zip: /home/space/datasets/patho_ds/tcga-ut/data_raw.zip
  scratch_root: /tmp/tcga-ut-materialize
  output_sqfs: /home/space/datasets-sqfs/tcga-ut/patch.sqfs
  materialization_sidecar: /home/space/datasets-sqfs/tcga-ut/patch.provenance.json
  manifest_partials_dir: /home/yannik.qu/master-thesis/experiments/2_benchmark_patch/outputs/tcga_ut/materialize/partials

slurm:
  project_root: /home/yannik.qu/master-thesis
  code_dir: /home/yannik.qu/master-thesis/experiments/2_benchmark_patch/code
  output_dir: /home/yannik.qu/master-thesis/experiments/2_benchmark_patch/outputs/tcga_ut/patch
  partition: gpu-2h
  test_partition: gpu-test
  tune_natural_observations_per_candidate: 6
  tune_shards_per_task: 4
  tune_natural_shards_per_task: 3
  confirm_natural_shards_per_task: 3
  confirm_controlled_shards_per_task: 10
  max_array_concurrency: 35
  container: /home/yannik.qu/master-thesis/experiments/2_benchmark_patch/environment.sif
  resources:
    # The heavy Virchow2 extraction over 1,608,060 patches runs as a separate
    # parallel array of short single-GPU `prepare-extract-shard` tasks on
    # gpu-2h (gpu-2d is scarce/contended); this `prepare` stage just finalizes
    # splits/provenance once the shared feature cache is fully populated, so
    # it needs little of its own GPU time.
    prepare: {partition: gpu-2h, gpus: 1, cpus: 8, memory: 16G}
    pilot: {partition: gpu-5h, gpus: 1, cpus: 8, memory: 32G}
    freeze: {partition: cpu-2d, gpus: 0, cpus: 4, memory: 256G}
    tune: {partition: gpu-2d, gpus: 1, cpus: 8}
    tune_natural: {partition: gpu-5h, gpus: 1, cpus: 4, memory: 96G, constraint: "80gb|40gb|h100|h200"}
    # gpu-2h: ~45% of controlled candidates timed out at 2h (K=30 is the
    # heaviest patch dataset here); gpu-5h absorbs the slow ones without a
    # per-task partition workaround.
    tune_controlled: {partition: gpu-5h, gpus: 1, cpus: 4, memory: 96G, constraint: "80gb|40gb|h100|h200"}
    tune_reduce: {partition: cpu-2h, gpus: 0, cpus: 4, memory: 256G}
    confirm: {partition: gpu-2d, gpus: 1, cpus: 8}
    confirm_natural: {partition: gpu-5h, gpus: 1, cpus: 8, memory: 96G, constraint: "80gb|40gb|h100|h200"}
    confirm_controlled: {partition: gpu-2h, gpus: 1, cpus: 8, memory: 96G, constraint: "80gb|40gb|h100|h200"}
    analyze: {partition: cpu-5h, gpus: 0, cpus: 8, memory: 256G}
    smoke: {partition: gpu-test, gpus: 1, cpus: 4}
  squashfs:
    - source: /home/space/datasets-sqfs/tcga-ut/patch.sqfs
      mount: /mnt/tcga-ut
      stages: [prepare]
