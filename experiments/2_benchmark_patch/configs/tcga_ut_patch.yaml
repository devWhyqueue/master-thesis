# TCGA-UT patch-classification cell.

paths:
  outputs: experiments/2_benchmark_patch/outputs/tcga_ut/patch

dataset:
  name: tcga_ut
  regime: patch
  target: cancer_type
  seed: 0
  version: tcga-ut-komura-2022
  eligibility_rules:
    source: zenodo_record_5889558_v1_0_authenticated_class_archives
    labels: 30_of_32_cancer_types_from_source_slide
    evidence: materialized_project_owned_squashfs_of_source_jpgs
    split_unit: tcga_participant
    class_exclusions:
      Lymphoid_Neoplasm_Diffuse_Large_B-cell_Lymphoma: dlbcl_contribution_cap_infeasible
      Cholangiocarcinoma: evidence_floor_infeasible_for_split_unit_clustered_inference
  excluded_classes:
    - Lymphoid_Neoplasm_Diffuse_Large_B-cell_Lymphoma
    - Cholangiocarcinoma
  root: /mnt/tcga-ut
  materialization_sidecar: /home/space/datasets-sqfs/tcga-ut/patch.provenance.json
  expected_slide_count: 8736
  expected_class_count: 32
  expected_patch_count: 1608060

feature_extraction:
  model_name: hf-hub:paige-ai/Virchow2
  revision: 3158645804b69e3f3bc4439d4116edddf0840a72
  weights_sha256: 8d6cea947eb2418c3b0dff48cfb9b238e47744ab0dfca21b2b0637b140769b4b
  batch_size: 64
  dtype: float16
  device: auto

# Standalone materialization step (run once via `materialize-tcga-ut`, not part
# of the submitted workflow): authenticates the shared archive against Zenodo
# and publishes the project-owned SqFS that `dataset.root` mounts above.
materialize_tcga_ut:
  record_id: "5889558"
  zenodo_version: "1.0"
  shared_zip: /home/space/datasets/patho_ds/tcga-ut/data_raw.zip
  scratch_root: /tmp/tcga-ut-materialize
  output_sqfs: /home/space/datasets-sqfs/tcga-ut/patch.sqfs
  materialization_sidecar: /home/space/datasets-sqfs/tcga-ut/patch.provenance.json
  manifest_partials_dir: /home/yannik.qu/master-thesis/experiments/2_benchmark_patch/outputs/tcga_ut/materialize/partials

slurm:
  project_root: /home/yannik.qu/master-thesis
  code_dir: /home/yannik.qu/master-thesis/experiments/2_benchmark_patch/code
  output_dir: /home/yannik.qu/master-thesis/experiments/2_benchmark_patch/outputs/tcga_ut/patch
  partition: gpu-2h
  test_partition: gpu-test
  tune_natural_observations_per_candidate: 6
  # Controlled candidates are not uniform work: assignment_count is 1 for
  # 'balanced' (6 observations/candidate = 3 splits x 2 seeds) and 3 for the
  # other four conditions (18 observations/candidate). CONTROLLED_CONDITIONS
  # puts 'balanced' first and the array is condition-major, so low array
  # indices are all the cheap 6-fit condition -- a per-candidate timing
  # measured only there (this comment used to cite ~10min/candidate,
  # ~70min/task at shards-per-task=24) is 3x too optimistic past the first
  # condition. Measured 2026-09-01 (this plan's Step 0): per_fit_seconds p95
  # ~168.5s for the 18-observation conditions, ~162.6s for 'balanced' -- a
  # worst-case candidate is up to ~220s * 18 =~ 66min. shards-per-task is
  # sized for the worst card in the pool (40gb, runtime K=1, see
  # tune_parallel_fits below) rather than split across partitions by card
  # tier; imbalance_benchmark.hydra.deadline.DeadlineGuard is the backstop
  # that turns an underestimate into a clean partial completion instead of a
  # TIMEOUT.
  tune_shards_per_task: 2
  # 4 base learning-rate candidates is the natural roster's actual ceiling
  # (_candidate_slots('ce') == 4): bundled_observation_array_size(4, 6, spt)
  # bottoms out at spt=4 (6 tasks); spt 10-15 bought nothing beyond that.
  tune_natural_shards_per_task: 4
  # Packs this many concurrent fits onto one GPU's tune-shard task -- now a
  # ceiling: shard_workers._vram_capped_workers resolves the actual K per
  # task from the card's free VRAM at runtime, so a 40gb card in the same
  # "80gb|40gb|h100|h200" pool packs fewer fits than an 80gb one without
  # needing a dedicated partition. Sized for an 80gb card at the measured
  # per-fit footprint (Step 0: peaks up to ~19.29 GiB/fit, dominated by a
  # handful of methods' own extra tensors -- e.g. a metric-learning method's
  # full-batch pairwise-distance eval -- not by the ~1.46 GiB analytic bank).
  tune_parallel_fits: 3
  # Natural group's bank holds the full unbalanced dataset (no per-condition
  # subsample, ~6.53 GiB analytic bank plus the same measured per-fit
  # transient) -- also a ceiling now; runtime K clamps a 40gb card down on
  # its own instead of needing a dedicated partition.
  tune_natural_parallel_fits: 2
  confirm_natural_shards_per_task: 3
  confirm_controlled_shards_per_task: 10
  max_array_concurrency: {gpu-5h: 35, gpu-2h: 50}
  container: /home/yannik.qu/master-thesis/experiments/2_benchmark_patch/environment.sif
  resources:
    # The heavy Virchow2 extraction over 1,608,060 patches runs as a separate
    # parallel array of short single-GPU `prepare-extract-shard` tasks on
    # gpu-2h (gpu-2d is scarce/contended); this `prepare` stage just finalizes
    # splits/provenance once the shared feature cache is fully populated, so
    # it needs little of its own GPU time.
    prepare: {partition: gpu-2h, gpus: 1, cpus: 8, memory: 16G}
    pilot: {partition: gpu-5h, gpus: 1, cpus: 8, memory: 32G}
    freeze: {partition: cpu-2d, gpus: 0, cpus: 4, memory: 256G}
    signals: {partition: cpu-5h, gpus: 0, cpus: 4, memory: 256G}
    tune: {partition: gpu-2d, gpus: 1, cpus: 8}
    # memory 48G: measured peak 26.8G at K=4 (job 4807044), ~1.8x headroom.
    tune_natural: {partition: gpu-2h, gpus: 1, cpus: 4, memory: 48G, constraint: "80gb|40gb|h100|h200"}
    # gpu-2h with the full 80gb|40gb|h100|h200 pool, 2026-09-01: the prior
    # gpu-5h reversion and the 40gb drop (both same day) were a
    # misdiagnosis -- three compounding defects (condition-major array
    # indices making 'balanced' look representative, the checkpoint
    # schedule's front-loading making a mid-fit progress line read far less
    # done than it was, and packed children logging nothing at all) produced
    # an apparent 500min-candidate that Step 0's direct shard-JSON
    # measurement does not reproduce (p95 per_fit_seconds ~168.5s, worst
    # candidate ~66min). shard_workers._vram_capped_workers now resolves K
    # from the task's actual free VRAM instead of a fixed constant sized for
    # the worst card the constraint admits, and DeadlineGuard converts a
    # card that still runs long into a clean partial completion instead of a
    # TIMEOUT -- so 40gb no longer needs its own partition or its own
    # constraint exclusion.
    tune_controlled: {partition: gpu-2h, gpus: 1, cpus: 4, memory: 48G, constraint: "80gb|40gb|h100|h200"}
    tune_reduce: {partition: cpu-2h, gpus: 0, cpus: 4, memory: 256G}
    confirm: {partition: gpu-2d, gpus: 1, cpus: 8}
    confirm_natural: {partition: gpu-2h, gpus: 1, cpus: 8, memory: 96G, constraint: "80gb|40gb|h100|h200"}
    confirm_controlled: {partition: gpu-2h, gpus: 1, cpus: 8, memory: 96G, constraint: "80gb|40gb|h100|h200"}
    # analyze's own recovery/RQ3 phase has its own recorded history of 5h
    # TIMEOUTs (bracs_patch.yaml commit 8f96820, panda_patch.yaml:105-109),
    # so it stays on cpu-2d.
    analyze: {partition: cpu-2d, gpus: 0, cpus: 8, memory: 256G}
    # analyze-combine TIMEOUT'd at 5h (job 4811165) on _apply_gates: ~144
    # crossed permutation tests ran serially on one core. Now parallel and
    # checkpointed (analysis/aggregation/aggregate.py), same pattern as the
    # interval cache -- back on cpu-5h.
    analyze-combine: {partition: cpu-5h, gpus: 0, cpus: 8, memory: 256G}
    smoke: {partition: gpu-test, gpus: 1, cpus: 4}
  squashfs:
    - source: /home/space/datasets-sqfs/tcga-ut/patch.sqfs
      mount: /mnt/tcga-ut
      stages: [prepare]

# Pooled standardization for the prespecified matching rule (protocol
# app:testing): the dominant shortage is a z-score across every unit of every
# dataset, so `match` must see all four roots even when it writes into one of
# them. Without this block cmd_match falls back to this config's own root and
# would standardize a single dataset against itself.
rq3:
  dataset_roots:
    - /home/yannik.qu/master-thesis/experiments/2_benchmark_patch/outputs/bracs/patch
    - /home/yannik.qu/master-thesis/experiments/2_benchmark_patch/outputs/camelyon16/patch
    - /home/yannik.qu/master-thesis/experiments/2_benchmark_patch/outputs/panda/patch
    - /home/yannik.qu/master-thesis/experiments/2_benchmark_patch/outputs/tcga_ut/patch
