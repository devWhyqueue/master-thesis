# Unified configuration for experiments/2_benchmark_patch/code/imbalance_benchmark.
# Local paths only; scientific controls/grids are checked-in constants in the
# package itself so this file cannot silently change the protocol.

paths:
  outputs: experiments/2_benchmark_patch/outputs/tcga_ut/patch

# Select and configure exactly one dataset adapter (imbalance_benchmark.datasets).
# regime: patch | wsi
dataset:
  name: tcga_ut
  regime: patch
  target: cancer_type
  seed: 0
  version: tcga-ut-komura-2022
  eligibility_rules:
    source: author_supplied_tumor_region_patches_from_diagnostic_slides
    labels: 32_cancer_types_from_source_slide
    evidence: readable_virchow2_cls_patchmean_feature_chunks
    split_unit: tcga_participant

  raw_root: /home/space/datasets/patho_ds/tcga-ut/raw
  feature_dir: /home/space/datasets/patho_ds/tcga-ut/patch_features/cls_patchmean/virchow_virchow2/raw
  feature_glob: "*.pt"
  feature_suffix_pattern: "_[0-9]+"
  feature_provenance_manifest: /home/space/datasets/patho_ds/tcga-ut/patch_features/cls_patchmean/virchow_virchow2/raw/feature_provenance_manifest.json
  expected_slide_count: 8736
  expected_class_count: 32
  expected_patch_count: 1608060

feature_extraction:
  model_name: hf-hub:paige-ai/Virchow2
  revision: 3158645804b69e3f3bc4439d4116edddf0840a72
  weights_sha256: 8d6cea947eb2418c3b0dff48cfb9b238e47744ab0dfca21b2b0637b140769b4b
  batch_size: 64
  dtype: float16
  device: auto


slurm:
  # Absolute Hydra paths: jobs execute from the checkout on the cluster, not this PC.
  project_root: /home/yannik.qu/master-thesis
  code_dir: /home/yannik.qu/master-thesis/experiments/2_benchmark_patch/code
  output_dir: /home/yannik.qu/master-thesis/experiments/2_benchmark_patch/outputs/tcga_ut/patch
  partition: gpu-2h
  test_partition: gpu-test
  confirm_natural_shards_per_task: 3
  confirm_controlled_shards_per_task: 10
  max_array_concurrency: 20
  container: /home/yannik.qu/master-thesis/experiments/2_benchmark_patch/environment.sif
  resources:
    prepare: {partition: gpu-5h, gpus: 1, cpus: 8}
    pilot: {partition: cpu-2h, gpus: 0, cpus: 4}
    freeze: {partition: cpu-2h, gpus: 0, cpus: 4}
    tune: {partition: gpu-2d, gpus: 1, cpus: 8}
    tune_natural: {partition: gpu-5h, gpus: 1, cpus: 4, memory: 32G}
    tune_controlled: {partition: gpu-5h, gpus: 1, cpus: 4, memory: 32G}
    tune_reduce: {partition: cpu-2h, gpus: 0, cpus: 1}
    confirm: {partition: gpu-2d, gpus: 1, cpus: 8}
    confirm_natural: {partition: gpu-2h, gpus: 1, cpus: 8, memory: 32G}
    confirm_controlled: {partition: gpu-2h, gpus: 1, cpus: 8, memory: 32G}
    analyze: {partition: cpu-5h, gpus: 0, cpus: 4, memory: 32G}
    smoke: {partition: gpu-test, gpus: 1, cpus: 4}

  # Optional datasets with many small files. Each image is copied to /tmp per job
  # and mounted at its adapter-visible path before Apptainer starts.
  squashfs: []
