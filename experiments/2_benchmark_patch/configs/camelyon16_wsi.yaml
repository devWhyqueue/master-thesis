    confirm: {partition: gpu-2d, gpus: 1, cpus: 8, memory: 96G}
    confirm_natural: {partition: gpu-5h, gpus: 1, cpus: 4, memory: 96G}
    confirm_controlled: {partition: gpu-2h, gpus: 1, cpus: 4, memory: 96G}
    analyze: {partition: cpu-2d, gpus: 0, cpus: 4, memory: 32G}
