  resources:
    prepare: {partition: gpu-2d, gpus: 1, cpus: 8, memory: 64G}
    pilot: {partition: cpu-5h, gpus: 0, cpus: 4, memory: 96G}
    freeze: {partition: cpu-2h, gpus: 0, cpus: 4, memory: 32G}
    tune: {partition: gpu-2d, gpus: 1, cpus: 8, memory: 96G}
    tune_natural: {partition: gpu-5h, gpus: 1, cpus: 4, memory: 96G}
    tune_controlled: {partition: gpu-5h, gpus: 1, cpus: 4, memory: 96G}
