# TCGA-UT prior-vs-support cause experiment (exp-27). r1/r{rho} are reused from exp-25's stored
# outputs (slurm.prevalence_outputs); this experiment fits only P{rho} (prior-only, r1's rows
# reweighted to r{rho}'s class shares) and S{rho} (support-only, r{rho}'s rows reweighted back to
# r1's balanced shares), plus their LP{rho}/Lr{rho} post-hoc logit-adjusted derivatives (no fit).
# Same G = 20 patients/class, class permutation, and patient draws as exp-25 (fully paired). CPU-only.

paths:
  outputs: experiments/6_prevalence/27_cause_tcga_ut/outputs/tcga_ut/patch

dataset:
  name: tcga_ut
  regime: patch
  target: cancer_type
  seed: 0
  version: tcga-ut-komura-2022
  eligibility_rules:
    source: zenodo_record_5889558_v1_0_authenticated_class_archives
    labels: 30_of_32_cancer_types_from_source_slide
    evidence: materialized_project_owned_squashfs_of_source_jpgs
    split_unit: tcga_participant
    class_exclusions:
      Lymphoid_Neoplasm_Diffuse_Large_B-cell_Lymphoma: dlbcl_contribution_cap_infeasible
      Cholangiocarcinoma: evidence_floor_infeasible_for_split_unit_clustered_inference
  excluded_classes:
    - Lymphoid_Neoplasm_Diffuse_Large_B-cell_Lymphoma
    - Cholangiocarcinoma
  root: /mnt/tcga-ut
  materialization_sidecar: /home/space/datasets-sqfs/tcga-ut/patch.provenance.json
  expected_slide_count: 8736
  expected_class_count: 32
  expected_patch_count: 1608060

